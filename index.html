  /* ---- sharing a training day ----
     A share carries the owner's exercise ids. The recipient stores them under a
     prefix derived from the share, so a later update matches exercise for
     exercise and whatever they have already logged stays attached. */
  function sharedExId(shareId, originalId) { return "sh" + String(shareId).slice(0, 8) + "_" + originalId; }

  function dayPayload(day) {
    return {
      name: day.name,
      color: day.color,
      ex: day.ex.map(function (ex) {
        return { id: ex.id, name: ex.name, sets: ex.sets, reps: ex.reps,
                 note: ex.note || "", rest: restOf(ex), each: !!ex.each };
      })
    };
  }

  function shareDay(day, friendId) {
    social.error = null;
    social.shareMsg = null;
    var existing = (state.social.sentShares || []).filter(function (s) {
      return s.recipient_id === friendId && s.day_key === day.id;
    })[0];

    return withSession()
      .then(function () {
        return api("/rest/v1/shared_days?on_conflict=owner_id,recipient_id,day_key", {
          method: "POST", prefer: "resolution=merge-duplicates,return=representation",
          body: [{
            owner_id: auth.user_id, recipient_id: friendId, day_key: day.id,
            day: dayPayload(day),
            version: existing ? existing.version + 1 : 1,
            updated_at: new Date().toISOString()
          }]
        });
      })
      .then(function (rows) {
        var v = (rows && rows[0] && rows[0].version) || 1;
        social.shareMsg = (existing ? "Update sent to " : "Sent to ") + nameOf(friendId) + " · v" + v;
        return loadSocial();
      })
      .catch(function (err) { social.error = err.message; render(); });
  }

  /* Copy a shared day into the program, or bring an existing copy up to date. */
  function applyShare(share) {
    var payload = share.day || {};
    var mine = state.program.filter(function (d) { return d.src && d.src.shareId === share.id; })[0];
    var ex = (payload.ex || []).map(function (e) {
      return {
        id: sharedExId(share.id, e.id), name: e.name, sets: e.sets, reps: e.reps,
        note: e.note || "", rest: typeof e.rest === "number" ? e.rest : defaultRest(e.name),
        each: !!e.each
      };
    });

    if (mine) {
      mine.name = payload.name || mine.name;
      mine.color = payload.color || mine.color;
      mine.ex = ex;
      mine.src.version = share.version;
    } else {
      state.program.push({
        id: uid("d"), name: payload.name || "Shared day", color: payload.color || "blue",
        ex: ex,
        src: { shareId: share.id, owner: share.owner_id, version: share.version }
      });
    }
    normalize(state.program);
    save();
    ui.view = "train";
    state.day = (mine || state.program[state.program.length - 1]).id;
    timerDay = null;
    render();
  }

  function shareStatus(share) {
    var mine = state.program.filter(function (d) { return d.src && d.src.shareId === share.id; })[0];
    if (!mine) return "new";
    return mine.src.version < share.version ? "update" : "current";
  }

  function nameOf(id) {
    if (id === (auth && auth.user_id)) return "You";
    var p = state.social.people[id];
    return p ? "@" + p.handle : "someone";
  }

  function addFriend(handle) {
    social.error = null;
    return withSession()
      .then(function () { return api("/rest/v1/rpc/find_profile", { method: "POST", body: { handle_input: handle } }); })
      .then(function (rows) {
        if (!rows || !rows.length) throw new Error("No one is using the handle @" + handle + ".");
        return api("/rest/v1/friendships", {
          method: "POST", prefer: "return=minimal",
          body: { requester: auth.user_id, addressee: rows[0].id }
        }).catch(function (err) {
          throw new Error(err.status === 409 ? "You have already sent @" + handle + " a request." : err.message);
        });
      })
      .then(loadSocial)
      .catch(function (err) { social.error = err.message; render(); });
  }

  function patchLink(id, body) {
    return withSession()
      .then(function () {
        return api("/rest/v1/friendships?id=eq." + id, { method: "PATCH", prefer: "return=minimal", body: body });
      })
      .then(loadSocial)
      .catch(function (err) { social.error = err.message; render(); });
  }

  function dropLink(id) {
    return withSession()
      .then(function () { return api("/rest/v1/friendships?id=eq." + id, { method: "DELETE", prefer: "return=minimal" }); })
      .then(loadSocial)
      .catch(function (err) { social.error = err.message; render(); });
  }

  function openFriend(id) {
    ui.friend = id;
    social.friendData = null;
    social.error = null;
    render();
    return withSession()
      .then(function () {
        return Promise.all([
          api("/rest/v1/sessions?user_id=eq." + id + "&select=*&order=date.desc&limit=12"),
          api("/rest/v1/prs?user_id=eq." + id + "&select=*&order=achieved_on.desc&limit=8"),
          api("/rest/v1/session_details?user_id=eq." + id + "&select=*")
        ]);
      })
      .then(function (res) {
        var detail = {};
        (res[2] || []).forEach(function (d) { detail[d.session_id] = d.entries || {}; });
        social.friendData = { sessions: res[0] || [], prs: res[1] || [], detail: detail };
      })
      .catch(function (err) { social.error = err.message; })

  /* ---- push notifications ----
     The public half of the VAPID pair. It is meant to be public — it only lets
     the browser verify that a push came from this app. The private half lives
     in the edge function's secrets and never touches this repo. */
  var VAPID_PUBLIC = "BCwM-TT-rr1Gwsx2hxtpTbLbuF9_vanJ5uFXjboCcSp3uIDsZ3qUMYUYNdcALRSTy55Ome3bx3BM0vKodIsPpqQ";
  var push = { state: "unknown", error: null, busy: false, tested: null };

  function installedToHomeScreen() {
    return window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  }

  function pushSupported() {
    return "Notification" in window && "serviceWorker" in navigator && "PushManager" in window;
  }

  function b64ToBytes(base64) {
    var padded = (base64 + "=".repeat((4 - base64.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/");
    var raw = atob(padded);
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  function bytesToB64(buf) {
    var bytes = new Uint8Array(buf), s = "";
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function refreshPushState() {
    if (!pushSupported()) { push.state = "unsupported"; return Promise.resolve(); }
    if (Notification.permission === "denied") { push.state = "blocked"; return Promise.resolve(); }
    return navigator.serviceWorker.ready
      .then(function (reg) { return reg.pushManager.getSubscription(); })
      .then(function (sub) { push.state = sub ? "on" : "off"; })
      .catch(function () { push.state = "off"; });
  }

  function storeSubscription(sub) {
    var raw = sub.toJSON();
    return api("/rest/v1/push_subscriptions?on_conflict=endpoint", {
      method: "POST", prefer: "resolution=merge-duplicates,return=minimal",
      body: [{
        user_id: auth.user_id,
        endpoint: sub.endpoint,
        p256dh: raw.keys.p256dh,
        auth: raw.keys.auth
      }]
    });
  }

  /* Registering with the push service fails intermittently — observed first-tap
     failures that succeed seconds later with nothing changed. Retry rather than
     making someone tap the button twice and assume it is broken. */
  function subscribeWithRetry(reg, attemptsLeft) {
    return reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: b64ToBytes(VAPID_PUBLIC)
    }).catch(function (err) {
      if (attemptsLeft <= 1) throw err;
      return new Promise(function (resolve) { setTimeout(resolve, 1500); })
        .then(function () { return subscribeWithRetry(reg, attemptsLeft - 1); });
    });
  }

  function enablePush() {
    push.error = null;
    if (!pushSupported()) {
      push.error = "This browser cannot show notifications.";
      push.state = "unsupported";
      render();
      return;
    }
    push.busy = true;
    render();

    /* must be called from the tap itself, not after an await */
    Notification.requestPermission()
      .then(function (perm) {
        if (perm !== "granted") throw new Error("Notifications were not allowed. You can change that in your phone's settings for this app.");
        return navigator.serviceWorker.ready;
      })
      .then(function (reg) {
        return reg.pushManager.getSubscription().then(function (existing) {
          return existing || subscribeWithRetry(reg, 3);
        });
      })
      .then(function (sub) { return withSession().then(function () { return storeSubscription(sub); }); })
      .then(function () { return sendTimezone(); })
      .then(function () { push.state = "on"; })
      .catch(function (err) { push.error = err.message; })
      .then(function () { push.busy = false; render(); });
  }

  /* Proves the whole chain — subscription, signing, the push service — without
     needing a friend to log a workout for you. */
  function testPush() {
    push.busy = true;
    push.error = null;
    push.tested = null;
    render();
    withSession()
      .then(function () { return api("/functions/v1/notify", { method: "POST", body: { kind: "test" } }); })
      .then(function (res) {
        if (!res || !res.devices) throw new Error("This phone is not registered. Turn notifications off and on again.");
        push.tested = res.sent
          ? "Sent to " + res.devices + " device" + (res.devices === 1 ? "" : "s") + " — check your lock screen."
          : "Your phone is registered but the push service rejected it. Turn notifications off and on again.";
      })
      .catch(function (err) { push.error = err.message; })
      .then(function () { push.busy = false; render(); });
  }

  function disablePush() {
    push.busy = true;
    push.error = null;
    render();
    navigator.serviceWorker.ready
      .then(function (reg) { return reg.pushManager.getSubscription(); })
      .then(function (sub) {
        if (!sub) return null;
        var endpoint = sub.endpoint;
        return sub.unsubscribe().then(function () {
          return withSession().then(function () {
            return api("/rest/v1/push_subscriptions?endpoint=eq." + encodeURIComponent(endpoint),
                       { method: "DELETE", prefer: "return=minimal" });
          });
        });
      })
      .catch(function (err) { push.error = err.message; })
      .then(function () { push.state = "off"; push.busy = false; render(); });
  }

  /* the reminder job needs to know when 16:00 is for this person */
  function sendTimezone() {
    var tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) { tz = ""; }
    if (!tz) return Promise.resolve();
    return api("/rest/v1/profiles?id=eq." + auth.user_id,
               { method: "PATCH", prefer: "return=minimal", body: { timezone: tz } }).catch(function () {});
  }

  function fanoutPush() {

      .catch(function () {});

  /* A gym is the worst place to depend on a network, so the automatic sync
     after a workout will often fail. Retry whenever the phone comes back:
     signal returns, or the app is brought to the front. */
  window.addEventListener("online", function () { if (auth) syncNow(true); });

  function syncStatus() {
    if (sync.busy) return "Syncing…";
    if (sync.error) return "Last attempt failed — " + sync.error;
    if (!state.cloud.lastSyncAt) return "Not synced yet";
    var mins = Math.floor((Date.now() - state.cloud.lastSyncAt) / 60000);
    if (mins < 1) return "Synced just now";
    if (mins < 60) return "Synced " + mins + " min ago";
    if (mins < 1440) return "Synced " + Math.floor(mins / 60) + "h ago";
    return "Synced " + Math.floor(mins / 1440) + "d ago";
  }

  var METRIC_LOOK = {
    protein:  { emoji: "\ud83c\udf57", color: "var(--met-protein)" },
    creatine: { emoji: "\u26a1", color: "var(--met-creatine)" },
    water:    { emoji: "\ud83d\udca7", color: "var(--met-water)" }
  };

  function eventLook(ev) {
    if (ev.type === "goal_hit") {
      return METRIC_LOOK[(ev.payload || {}).metric] || { emoji: "\ud83c\udfaf", color: "var(--met-water)" };
    }
    if (ev.type === "pr") return { emoji: "\ud83c\udfc6", color: "var(--plate-yellow)" };
    if (ev.type === "workout_finished") return { emoji: "\ud83c\udfcb\ufe0f", color: "var(--plate-green)" };
    return { emoji: "\u2022", color: "var(--plate-blue)" };
  }

  function ago(iso) {
    var mins = Math.floor((Date.now() - Date.parse(iso)) / 60000);
    if (mins < 1) return "now";   /* also catches a timestamp slightly ahead of us */
    if (mins < 60) return mins + "m";
    if (mins < 1440) return Math.floor(mins / 60) + "h";
    return Math.floor(mins / 1440) + "d";
  }

  /* "You hit THEIR water goal" was the bug — the possessive has to follow the
     person, not the sentence template. */
  function possessive(userId) { return userId === (auth && auth.user_id) ? "your" : "their"; }

  function feedLine(ev) {
    var who = "<b>" + esc(nameOf(ev.user_id)) + "</b>";
    var p = ev.payload || {};
    if (ev.type === "workout_finished") return who + " finished an exercise";
    if (ev.type === "pr") return who + " set a personal record";
    if (ev.type === "goal_hit") {
      return who + " hit " + possessive(ev.user_id) + " " +
             esc((p.name || "daily").toLowerCase()) + " goal";
    }
    return who + " logged something";
  }

  /* The line under the sentence: what it actually was. Workouts and records
     earn one; a goal does not, because its numbers already say everything. */
  function feedHeadline(ev) {
    var p = ev.payload || {};
    if (ev.type === "workout_finished") return esc(p.day || "A workout");
    if (ev.type === "pr") return esc(p.exercise || "A lift");
    return "";
  }

  function feedSub(ev) {
    var p = ev.payload || {};
    if (ev.type === "workout_finished") {
      var bits = [];
      if (p.lifts) bits.push(p.lifts + " exercise" + (Number(p.lifts) === 1 ? "" : "s"));
      bits.push(p.sets + " set" + (Number(p.sets) === 1 ? "" : "s"));
      bits.push(Number(p.volume || 0).toLocaleString() + " " + esc(p.unit || "kg"));
      if (p.minutes) bits.push(fmtMinutes(p.minutes));
      if (p.prs) bits.push(p.prs + " record" + (Number(p.prs) === 1 ? "" : "s") + " \ud83c\udfc6");
      return bits.join(" \u00b7 ");
    }
    if (ev.type === "pr") {
      return esc(p.weight) + " \u00d7 " + esc(p.reps) + (p.per_hand ? " per hand" : "") +
             (p.e1rm ? " \u00b7 est. 1RM " + esc(p.e1rm) + " " + esc(p.unit || "kg") : "");
    }
    if (ev.type === "goal_hit") return esc(p.total) + " / " + esc(p.target) + " " + esc(p.unit || "");
    return "";
  }

      var h = ((input && input.value) || "").trim().toLowerCase().replace(/^@/, "");
      if (!h) { if (input) input.focus(); return; }
      addFriend(h);
      return;
    }

    var acc = t.closest("[data-accept]");
    if (acc) { patchLink(acc.dataset.accept, { status: "accepted" }); return; }

    var dec = t.closest("[data-decline]");
    if (dec) { dropLink(dec.dataset.decline); return; }

    var un = t.closest("[data-unfriend]");
    if (un) {
      if (!confirm("Remove this friend? They stop seeing your activity immediately.")) return;
      dropLink(un.dataset.unfriend);
      return;

    var sh = t.closest("[data-share]");
    if (sh) {
      var link = (state.social.links || []).filter(function (l) { return l.id === sh.dataset.share; })[0];
      if (!link) return;
      var next = !iShareWith(link);
      var body = {};
      body[iAmRequester(link) ? "requester_shares_detail" : "addressee_shares_detail"] = next;
      patchLink(link.id, body);
      return;

    var take = t.closest("[data-takeshare]");
    if (take) {
      var sh = (state.social.shares || []).filter(function (x) { return x.id === take.dataset.takeshare; })[0];

      return;
    }

    var open = t.closest("[data-openfriend]");
    if (open) { openFriend(open.dataset.openfriend); return; }

    if (t.closest("[data-closefriend]")) { ui.friend = null; social.friendData = null; render(); return; }

                  '<button class="btn day" data-pushtest' + (push.busy ? " disabled" : "") + ">" +
                    (push.busy ? "Sending…" : "Send test") + "</button>" +
                  '<button class="btn" data-pushoff' + (push.busy ? " disabled" : "") + ">Turn off</button>" +
                "</div>"
              : '<p class="hint">Get told when a friend finishes a workout, sets a record or hits a goal, plus a nudge at 16:00 if you are behind on your own fuel.</p>' +
                (installedToHomeScreen() ? "" :
                  '<p class="hint" style="color:var(--plate-red)">Add this to your Home Screen and open it from the icon first — an iPhone will not deliver notifications to a browser tab.</p>') +
                '<button class="btn day" data-pushon' + (push.busy ? " disabled" : "") + ">" +
                  (push.busy ? "Asking…" : "Turn on notifications") + "</button>") +
        (push.error ? '<p class="hint" style="color:var(--plate-red)">' + esc(push.error) + "</p>" : "") +
      "</div></section>";

    return notifications +
      '<section class="card"><div class="edit-card">' +
      '<div class="lab">Account</div>' +
      '<p class="hint"><b class="num">@' + esc(auth.handle) + "</b> · " + esc(auth.email || "") + "</p>" +
      '<p class="hint"' + (sync.error ? ' style="color:var(--plate-red)"' : "") + ">" + esc(syncStatus()) +
        (sync.restored ? " · restored " + sync.restored + " session" + (sync.restored === 1 ? "" : "s") : "") + "</p>" +
      '<div class="segs">' +
        '<button class="btn day" data-syncnow' + (sync.busy ? " disabled" : "") + ">Sync now</button>" +
        /* deliberately NOT disabled while syncing — the moment you most want
           this is right after signing in, which is exactly when a sync is
           running. It waits for the sync instead of being unclickable. */
        '<button class="btn" data-restore-cloud>Restore</button>' +
      "</div>" +
      '<button class="btn" data-signout>Sign out</button>' +
    "</div></section>";
  }

  function handleAccountClick(t) {
    if (t.closest("[data-signin]") || t.closest("[data-signup]")) {
      var creating = !!t.closest("[data-signup]");
      var email = (document.getElementById("authEmail") || {}).value || "";
      var pass = (document.getElementById("authPass") || {}).value || "";
      if (!email.trim() || pass.length < 6) {
        sync.error = "Enter an email and a password of at least 6 characters.";
        render();
        return true;
      }
      sync.error = null;
      sync.busy = true;
      render();
      (creating ? signUp(email.trim(), pass) : signIn(email.trim(), pass))
        .then(function () { sync.busy = false; render(); return syncNow(true).then(loadSocial); })
        .catch(function (err) { sync.busy = false; sync.error = err.message; render(); });
      return true;
    }

    if (t.closest("[data-sethandle]")) {
      var h = ((document.getElementById("authHandle") || {}).value || "").trim().toLowerCase();
      if (!/^[a-z0-9_]{3,20}$/.test(h)) {
        sync.error = "Handles are 3–20 characters: lower case letters, numbers, underscores.";
        render();
        return true;
      }
      sync.error = null;
      claimHandle(h)
        .then(function () { render(); return syncNow(true); })
        .catch(function (err) {
          sync.error = err.status === 409 || /duplicate/i.test(err.message)
            ? "That handle is taken — try another."
            : err.message;
          render();
        });
      return true;
    }

    if (t.closest("[data-pushon]")) { enablePush(); return true; }
    if (t.closest("[data-pushtest]")) { testPush(); return true; }
    if (t.closest("[data-pushoff]")) { disablePush(); return true; }
    if (t.closest("[data-syncnow]")) { syncNow(); return true; }
    if (t.closest("[data-restore-cloud]")) { restoreFromCloud(); return true; }
    if (t.closest("[data-signout]")) { signOut(); return true; }
    return false;
  }

  /* ---------- go ---------- */
  load();
  save();          /* write back whatever load() had to migrate */
  auth = loadAuth();
  applyTheme();
  /* flush anything logged while offline since the app was last open */
  if (auth) {
    queueSync();
    refreshPushState().then(repaintIfData);
  }
  if (!getDay(state.day)) state.day = state.program[0].id;
  render();
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* offline support is optional */ });
    });
  }
</script>
</body>
</html>
