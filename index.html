      <div class="prog">
        <div class="prog-top"><b id="progLabel">0 of 0 sets</b><span id="progVol"></span></div>
        <div class="track"><div class="fill" id="progFill"></div></div>
      </div>
      <button class="timer" id="timer"><b>2:00</b><span>Rest</span></button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- storage ---------- */
  var VERSION = "1.14.1";
  var KEY = "plate-ledger-v1";
  var store = null;
  try {
    window.localStorage.setItem("__pl", "1");
    window.localStorage.removeItem("__pl");
    store = window.localStorage;
  } catch (e) { store = null; }

  /* ---------- default program ---------- */
  var HEAVY = 180;   // compounds — the ones that actually tax you
  var LIGHT = 90;    // isolation and accessory work

  /* Exercises that read as isolation work, so imported or renamed entries
     still get a sensible rest without anyone setting it by hand. */
  var ISOLATION = /(lateral|raise|curl|pushdown|push-down|extension|calf|abs|crunch|fly|flye|shrug|face pull|kickback|rear delt|pec deck)/i;

  function defaultRest(name) { return ISOLATION.test(String(name)) ? LIGHT : HEAVY; }

  function restOf(ex) { return typeof ex.rest === "number" ? ex.rest : defaultRest(ex.name); }

  function fmtRest(sec) { return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }

  function defaultProgram() {
    return [
      { id: "d1", name: "Upper A", color: "blue", ex: [
        { id: "d1e1", name: "Barbell Bench Press", sets: 3, reps: "6–8", note: "", rest: HEAVY },
        { id: "d1e2", name: "Chest-Supported Row", sets: 3, reps: "8–10", note: "", rest: HEAVY },
        { id: "d1e3", name: "Incline Dumbbell Press", sets: 3, reps: "8–12", note: "", rest: HEAVY, each: true },
        { id: "d1e4", name: "Lat Pulldown", sets: 3, reps: "8–12", note: "", rest: HEAVY },
        { id: "d1e5", name: "Lateral Raises", sets: 3, reps: "12–20", note: "", rest: LIGHT, each: true },
        { id: "d1e6", name: "Cable Triceps Pushdown", sets: 2, reps: "10–15", note: "", rest: LIGHT },
        { id: "d1e7", name: "Dumbbell / Cable Curl", sets: 2, reps: "10–15", note: "", rest: LIGHT }
      ]},
      { id: "d2", name: "Lower A", color: "red", ex: [
        { id: "d2e1", name: "Back Squat", sets: 3, reps: "6–8", note: "", rest: HEAVY },
        { id: "d2e2", name: "Romanian Deadlift", sets: 3, reps: "8–10", note: "", rest: HEAVY },
        { id: "d2e3", name: "Leg Press", sets: 3, reps: "10–15", note: "", rest: HEAVY },
        { id: "d2e4", name: "Leg Curl", sets: 3, reps: "10–15", note: "", rest: LIGHT },
        { id: "d2e5", name: "Calf Raises", sets: 3, reps: "10–15", note: "", rest: LIGHT },
        { id: "d2e6", name: "Abs", sets: 3, reps: "10–15", note: "2–3 sets — third optional", rest: LIGHT }
      ]},
      { id: "d3", name: "Upper B", color: "yellow", ex: [
        { id: "d3e1", name: "Incline Barbell or DB Press", sets: 3, reps: "6–10", note: "", rest: HEAVY },
        { id: "d3e2", name: "Pull-Ups / Lat Pulldown", sets: 3, reps: "8–12", note: "", rest: HEAVY },
        { id: "d3e3", name: "Machine or DB Chest Press", sets: 3, reps: "8–12", note: "", rest: HEAVY },
        { id: "d3e4", name: "Seated Cable Row", sets: 3, reps: "8–12", note: "", rest: HEAVY },
        { id: "d3e5", name: "Lateral Raises", sets: 3, reps: "12–20", note: "", rest: LIGHT, each: true },
        { id: "d3e6", name: "Overhead Triceps Extension", sets: 2, reps: "10–15", note: "", rest: LIGHT },
        { id: "d3e7", name: "Preacher / Hammer Curl", sets: 2, reps: "10–15", note: "", rest: LIGHT }
      ]},
      { id: "d4", name: "Lower B", color: "green", ex: [
        { id: "d4e1", name: "Deadlift", sets: 2, reps: "4–6", note: "", rest: HEAVY },
        { id: "d4e2", name: "Hack Squat / Front Squat", sets: 3, reps: "8–12", note: "", rest: HEAVY },
        { id: "d4e3", name: "Bulgarian Split Squat", sets: 3, reps: "8–12", note: "Each leg · 2–3 sets", rest: HEAVY },
        { id: "d4e4", name: "Leg Curl", sets: 3, reps: "10–15", note: "", rest: LIGHT },
        { id: "d4e5", name: "Calf Raises", sets: 3, reps: "10–15", note: "", rest: LIGHT },
        { id: "d4e6", name: "Abs", sets: 3, reps: "10–15", note: "2–3 sets — third optional", rest: LIGHT }
      ]}
    ];
  }

  /* Fill in fields added after a program was first saved. */
  function normalize(program) {
    program.forEach(function (day) {
      day.ex.forEach(function (ex) {
        if (typeof ex.rest !== "number") ex.rest = defaultRest(ex.name);
        ex.each = ex.each === true;
      });
    });
    return program;
  }

  function normalizeCloud(c) {
    var v = (c && typeof c === "object") ? c : {};
    return {
      lastSyncAt: v.lastSyncAt || null,
      programAt: Number(v.programAt) || 0,
      programSnap: typeof v.programSnap === "string" ? v.programSnap : ""
    };
  }

  function normalizeFuel(fuel) {
    var f = fuel && typeof fuel === "object" ? fuel : defaultFuel();
    var d = defaultTargets();
    f.targets = f.targets || {};
    METRICS.forEach(function (m) {
      if (typeof f.targets[m.id] !== "number" || !(f.targets[m.id] > 0)) f.targets[m.id] = d[m.id];
    });
    f.days = f.days || {};
    for (var date in f.days) {
      METRICS.forEach(function (m) {
        var arr = f.days[date][m.id];
        if (!Array.isArray(arr)) return;
        f.days[date][m.id] = arr.map(function (e) {
          return (e && typeof e === "object") ? e : { v: Number(e) || 0, t: 0 };
        });
      });
    }
    return f;
  }

  /* Sessions gained a key, a start time and a finished flag. Anything logged
     before that is closed out, except today's, which you may still be mid-way
     through. Entries keep whatever weight convention they were logged under. */
  function normalizeSessions(sessions) {
    var today = todayKey();
    for (var k in sessions) {
      var s = sessions[k];
      if (!s.key) s.key = k;
      if (typeof s.startedAt !== "number") s.startedAt = 0;
      if (typeof s.finished !== "boolean") s.finished = s.date !== today;
      for (var id in s.entries) {
        if (s.entries[id].each !== true) s.entries[id].each = false;
      }
    }
    return sessions;
  }

  /* Water is held in millilitres and shown in litres; the rest are grams. */
  var METRICS = [
    { id: "protein",  name: "Protein",  unit: "g", per: 1,    quick: [20, 30, 50],   step: "1" },
    { id: "creatine", name: "Creatine", unit: "g", per: 1,    quick: [5, 10],        step: "0.5" },
    { id: "water",    name: "Water",    unit: "L", per: 1000, quick: [250, 500, 750], step: "50", inputUnit: "ml" }
  ];

  function defaultTargets() { return { protein: 200, creatine: 10, water: 3000 }; }

  function defaultFuel() { return { targets: defaultTargets(), days: {} }; }

  /* Cached so the Friends tab shows something without a signal. */
  function defaultSocial() { return { links: [], people: {}, feed: [], shares: [], sentShares: [], fetchedAt: null }; }

  function normalizeSocial(v) {
    if (!v || typeof v !== "object") return defaultSocial();
    return {
      links: Array.isArray(v.links) ? v.links : [],
      people: (v.people && typeof v.people === "object") ? v.people : {},
      feed: Array.isArray(v.feed) ? v.feed : [],
      shares: Array.isArray(v.shares) ? v.shares : [],
      sentShares: Array.isArray(v.sentShares) ? v.sentShares : [],
      fetchedAt: v.fetchedAt || null
    };
  }

  function defaultState() {
    return {
      v: 1,
      program: normalize(defaultProgram()),   /* same shape as a loaded one, so
                                                 an untouched program compares equal */
      sessions: {},
      fuel: defaultFuel(),
      cloud: { lastSyncAt: null, programAt: 0, programSnap: "" },
      social: defaultSocial(),
      unit: "kg",
      rest: 120,
      sound: true,
      theme: "system",
      day: "d1"
    };
  }

  var state = defaultState();
  var ui = { view: "train", edit: false, openSession: null };

  function load() {
    if (!store) return;
    var raw = store.getItem(KEY);
    if (!raw) return;
    try {
      var saved = JSON.parse(raw);
      if (saved && saved.program && saved.sessions) {
        state = {
          v: 1,
          program: normalize(saved.program),
          sessions: normalizeSessions(saved.sessions),
          fuel: normalizeFuel(saved.fuel),
          cloud: normalizeCloud(saved.cloud),
          social: normalizeSocial(saved.social),
          unit: saved.unit === "lb" ? "lb" : "kg",
          rest: typeof saved.rest === "number" ? saved.rest : 120,
          sound: saved.sound !== false,
          theme: saved.theme || "system",
          day: saved.day || saved.program[0].id
        };
      }
    } catch (e) { /* keep defaults */ }
  }

  var saveTimer = null;
  function save() {
    if (!store) return;
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { store.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }, 120);
  }

  /* ---------- helpers ---------- */
  var COLORS = ["blue", "red", "yellow", "green"];
  var REST_CHOICES = [60, 90, 120, 180, 240];

  function uid(p) { return p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3); }

  function todayKey() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function prettyDate(iso) {
    var p = iso.split("-");
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    var t = todayKey();
    if (iso === t) return "Today";
    var y = new Date();
    y.setDate(y.getDate() - 1);
    var ym = String(y.getMonth() + 1).padStart(2, "0");
    var yd = String(y.getDate()).padStart(2, "0");
    if (iso === y.getFullYear() + "-" + ym + "-" + yd) return "Yesterday";
    return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function getDay(id) {
    for (var i = 0; i < state.program.length; i++) if (state.program[i].id === id) return state.program[i];
    return state.program[0];
  }

  /* Later of two sessions. Same-day repeats are told apart by start time. */
  function isLater(a, b) {
    if (!b) return true;
    if (a.date !== b.date) return a.date > b.date;
    return (a.startedAt || 0) > (b.startedAt || 0);
  }

  /* The open session for today's selected day, or a fresh one. Finishing a
     workout closes the current session, so the same day can be logged twice. */
  function currentSession() {
    var day = getDay(state.day);
    var today = todayKey();
    var found = null;
    for (var k in state.sessions) {
      var s = state.sessions[k];
      if (s.date === today && s.dayId === day.id && !s.finished) { found = s; break; }
    }
    if (!found) {
      var key = today + "__" + day.id + "__" + Date.now().toString(36);
      found = {
        key: key, date: today, dayId: day.id, dayName: day.name, color: day.color,
        startedAt: Date.now(), finished: false, entries: {}
      };
      state.sessions[key] = found;
    }
    found.dayName = day.name;
    found.color = day.color;
    return found;
  }

  function entryFor(session, ex) {
    if (!session.entries[ex.id]) session.entries[ex.id] = { name: ex.name, sets: [], each: !!ex.each };
    var e = session.entries[ex.id];
    e.name = ex.name;
    e.each = !!ex.each;
    while (e.sets.length < ex.sets) e.sets.push({ w: "", r: "", done: false });
    return e;
  }

  function lastFor(exId, exceptKey) {
    var best = null, bestSession = null;
    for (var k in state.sessions) {
      if (k === exceptKey) continue;
      var s = state.sessions[k];
      var e = s.entries[exId];
      if (!e) continue;
      var done = e.sets.filter(function (x) { return x.done; });
      if (!done.length) continue;
      if (isLater(s, bestSession)) { bestSession = s; best = { date: s.date, sets: done, each: e.each }; }
    }
    return best;
  }

  /* A dumbbell exercise records the weight of one dumbbell, so both hands count. */
  function volumeOf(session) {
    var v = 0;
    for (var id in session.entries) {
      var e = session.entries[id];
      var mult = e.each ? 2 : 1;
      e.sets.forEach(function (s) {
        if (s.done) v += (parseFloat(s.w) || 0) * (parseFloat(s.r) || 0) * mult;
      });
    }
    return v;
  }

  /* ---------- personal records ----------
     Epley: a top single and a heavy triple are not comparable on weight alone,
     so records are scored on estimated one-rep max. Per-hand entries are only
     ever compared with other per-hand entries. */
  function e1rm(w, r) {
    var weight = parseFloat(w) || 0, reps = parseFloat(r) || 0;
    if (weight <= 0 || reps <= 0) return 0;
    return weight * (1 + reps / 30);
  }

  function bestBefore(exId, each, exceptKey) {
    var best = 0;
    for (var k in state.sessions) {
      if (k === exceptKey) continue;
      var e = state.sessions[k].entries[exId];
      if (!e || !!e.each !== !!each) continue;
      e.sets.forEach(function (s) {
        if (s.done) best = Math.max(best, e1rm(s.w, s.r));
      });
    }
    return best;
  }

  /* Records in one session: the set that beat everything before it, and only
     the best such set per exercise — three PRs on one exercise is one PR. */
  function recordsIn(session, program) {
    var out = [];
    for (var exId in session.entries) {
      var e = session.entries[exId];
      var prior = bestBefore(exId, e.each, session.key);
      if (prior <= 0) continue;            /* first time counts as a baseline, not a PR */
      var top = null;
      e.sets.forEach(function (s) {
        if (!s.done) return;
        var v = e1rm(s.w, s.r);
        if (v > prior + 0.01 && (!top || v > top.e1rm)) top = { e1rm: v, w: s.w, r: s.r };
      });
      if (top) out.push({ exId: exId, name: e.name, each: !!e.each, w: top.w, r: top.r, e1rm: top.e1rm, prior: prior });
    }
    return out.sort(function (a, b) { return (b.e1rm - b.prior) - (a.e1rm - a.prior); });
  }

  function isRecordSet(session, exId, index) {
    var e = session.entries[exId];
    if (!e || !e.sets[index] || !e.sets[index].done) return false;
    var v = e1rm(e.sets[index].w, e.sets[index].r);
    if (v <= 0) return false;
    var prior = bestBefore(exId, e.each, session.key);
    if (prior <= 0 || v <= prior + 0.01) return false;
    /* only the best set of the session wears the badge */
    for (var i = 0; i < e.sets.length; i++) {
      if (i !== index && e.sets[i].done && e1rm(e.sets[i].w, e.sets[i].r) > v) return false;
    }
    return true;
  }

  /* Time under the bar, not time with the app open. The clock starts when the
     first set is ticked — opening the day an hour before you lift should not
     count as an hour of training. */
  function sessionMinutes(s) {
    var from = s.firstSetAt || s.startedAt || 0;
    var to = s.finishedAt || 0;
    if (!from || !to || to <= from) return 0;
    var mins = Math.round((to - from) / 60000);
    return (mins > 0 && mins < 600) ? mins : 0;   /* ignore a forgotten session */
  }

  function fmtMinutes(mins) {
    if (!mins) return "";
    var h = Math.floor(mins / 60), m = mins % 60;
    return h ? h + "h " + m + "m" : m + " min";
  }

  function plannedSets(day, session) {
    return day.ex.reduce(function (a, ex) {
      var e = session.entries[ex.id];
      return a + Math.max(ex.sets, e ? e.sets.length : 0);
    }, 0);
  }

  function allDone(day, session) {
    var planned = plannedSets(day, session);
    return planned > 0 && doneCount(session) >= planned;
  }

  function doneCount(session) {
    var n = 0;
    for (var id in session.entries) n += session.entries[id].sets.filter(function (s) { return s.done; }).length;
    return n;
  }

  /* ---------- the bell ----------
     Synthesised rather than loaded: an audio file is one more thing to fetch,
     and this has to work in a basement. Two notes a beat apart, quick decay —
     audible over a gym without being a fire alarm. */
  var audioCtx = null;

  function primeAudio() {
    if (!state.sound) return;
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) audioCtx = new Ctx();
      /* iOS starts every context suspended until a real tap unlocks it, which
         is why this is called from the tap that starts the timer. */
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) { audioCtx = null; }
  }

  function ding() {
    if (!state.sound || !audioCtx) return;
    try {
      [[880, 0], [1318.5, 0.13]].forEach(function (note) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        var at = audioCtx.currentTime + note[1];
        osc.type = "sine";
        osc.frequency.setValueAtTime(note[0], at);
        gain.gain.setValueAtTime(0.0001, at);
        gain.gain.exponentialRampToValueAtTime(0.32, at + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.85);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(at);
        osc.stop(at + 0.9);
      });
    } catch (e) { /* a silent timer is better than a broken one */ }
    if (navigator.vibrate) { try { navigator.vibrate([120, 60, 120]); } catch (e) {} }
  }

  /* ---------- rest timer ---------- */
  var timerEnd = 0, timerTick = null, timerLen = 0, timerDay = null;
  var timerEl = document.getElementById("timer");

  var restOver = false;
  var restBannerEl = document.getElementById("restBanner");
  var bottomRowEl = document.getElementById("bottomRow");

  function showRestOver() {
    restOver = true;
    ding();
    paintBottom();
  }

  function clearRestOver() {
    if (!restOver) return;
    restOver = false;
    paintBottom();
  }

  var bottomEl = document.getElementById("bottom");

  function bottomBelongsHere() {
    if (restOver || timerEnd) return true;              /* a live rest follows you */
    return ui.view === "train" || ui.view === "fuel";   /* otherwise: training only */
  }

  function paintBottom() {
    var show = bottomBelongsHere();
    bottomEl.hidden = !show;
    appEl.classList.toggle("no-bottom", !show);
    restBannerEl.hidden = !restOver;
    bottomRowEl.hidden = restOver;
    /* Fuel keeps the goal progress but not the rest timer, which belongs to
       lifting — unless a rest is genuinely counting down, in which case it
       should stay in sight wherever you are. */
    timerEl.hidden = !(ui.view === "train" || timerEnd);
  }

  restBannerEl.addEventListener("click", clearRestOver);

  function paintTimer() {
    /* Every set ticked: there is nothing left to rest for, so the button
       becomes the way to close the workout out. */
    if (ui.view === "train" && !ui.edit && allDone(getDay(state.day), currentSession())) {
      timerEl.className = "timer save";
      timerEl.innerHTML = "<b>Save</b><span>workout</span>";
      return;
    }
    if (!timerEnd) {
      timerEl.className = "timer";
      timerEl.innerHTML = "<b>" + fmtRest(timerLen || state.rest) + "</b><span>Rest</span>";
      return;
    }
    var left = Math.max(0, Math.round((timerEnd - Date.now()) / 1000));
    timerEl.className = "timer running";
    timerEl.innerHTML = "<b>" + Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0") +
      "</b><span>Tap to stop</span>";
    if (left <= 0) { stopTimer(); showRestOver(); }
  }

  /* Rest length comes from the exercise you just finished; a bare tap on the
     button reuses whatever you last rested for. */
  function startTimer(seconds) {
    clearRestOver();
    primeAudio();                       /* called from a tap, which iOS requires */
    timerLen = seconds || timerLen || state.rest;
    timerEnd = Date.now() + timerLen * 1000;
    if (timerTick) clearInterval(timerTick);
    timerTick = setInterval(paintTimer, 250);
    paintTimer();
    paintBottom();
  }

  function stopTimer() {
    timerEnd = 0;
    if (timerTick) { clearInterval(timerTick); timerTick = null; }
    paintTimer();
    paintBottom();
  }

  timerEl.addEventListener("click", function () {
    if (timerEl.classList.contains("save")) { finishWorkout(); return; }
    if (timerEnd) stopTimer(); else startTimer();
  });

  /* ---------- chrome ---------- */
  var appEl = document.getElementById("app");
  var viewEl = document.getElementById("view");
  var daysEl = document.getElementById("days");
  var navEl = document.getElementById("nav");

  document.getElementById("today").textContent =
    new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });

  navEl.addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-view]");
    if (!b) return;
    ui.view = b.dataset.view;
    ui.edit = false;
    ui.friend = null;
    render();
    if (ui.view === "friends" && auth) loadSocial();
  });

  function renderDays() {
    daysEl.hidden = ui.view !== "train";
    if (ui.view !== "train") { daysEl.innerHTML = ""; return; }
    daysEl.innerHTML = state.program.map(function (d) {
      return '<button class="chip" data-day="' + d.id + '" aria-pressed="' + (d.id === state.day) +
        '" style="--c: var(--plate-' + d.color + ')"><i></i>' + esc(d.name) + "</button>";
    }).join("");
  }

  daysEl.addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-day]");
    if (!b) return;
    state.day = b.dataset.day;
    ui.edit = false;
    save();
    render();
  });

  function updateProgress() {
    var fill = document.getElementById("progFill");
    var label = document.getElementById("progLabel");
    var vol = document.getElementById("progVol");
    if (ui.view === "fuel") {
      var today = todayKey();
      var hits = METRICS.filter(function (m) { return fuelHit(today, m.id); }).length;
      var avg = METRICS.reduce(function (a, m) {
        return a + Math.min(1, fuelTotal(today, m.id) / state.fuel.targets[m.id]);
      }, 0) / METRICS.length * 100;
      label.textContent = hits + " of " + METRICS.length + " goals hit";
      vol.textContent = Math.round(avg) + "% of today";
      fill.style.width = avg + "%";
      return;
    }

    if (ui.view !== "train") {
      var total = 0, done = 0, v = 0;
      for (var k in state.sessions) { done += doneCount(state.sessions[k]); v += volumeOf(state.sessions[k]); }
      label.textContent = done + " sets logged all-time";
      vol.textContent = Math.round(v).toLocaleString() + " " + state.unit;
      fill.style.width = done ? "100%" : "0%";
      return;
    }
    var day = getDay(state.day);
    var s = currentSession();
    var planned = plannedSets(day, s);
    var d = doneCount(s);
    label.textContent = d + " of " + planned + " sets";
    vol.textContent = Math.round(volumeOf(s)).toLocaleString() + " " + state.unit;
    fill.style.width = planned ? Math.min(100, (d / planned) * 100) + "%" : "0%";
  }

  function render() {
    var day = getDay(state.day);
    appEl.className = "app theme-" + day.color;
    Array.prototype.forEach.call(navEl.children, function (b) {
      b.setAttribute("aria-current", String(b.dataset.view === ui.view));
    });
    renderDays();

    /* Before the first set of a day is ticked, the idle timer shows what that day
       opens with. After that it follows whatever you last rested for. */
    if (ui.view === "train" && !timerEnd) {
      if (timerDay !== day.id || doneCount(currentSession()) === 0) {
        timerLen = day.ex.length ? restOf(day.ex[0]) : state.rest;
        timerDay = day.id;
      }
    }

    if (ui.view === "train") viewEl.innerHTML = ui.edit ? editHTML(day) : trainHTML(day);
    else if (ui.view === "fuel") viewEl.innerHTML = fuelHTML();
    else if (ui.view === "friends") viewEl.innerHTML = friendsHTML();
    else if (ui.view === "history") viewEl.innerHTML = historyHTML();
    else viewEl.innerHTML = dataHTML();
    updateProgress();
    paintTimer();
    paintBottom();
  }

  /* ---------- train view ---------- */
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  var STAR = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.6l2.7 6.1 6.6.6-5 4.4 1.5 6.5-5.8-3.5-5.8 3.5 1.5-6.5-5-4.4 6.6-.6z"/></svg>';

  function unitLabel(ex) { return ex.each ? state.unit + " / hand" : state.unit; }

  /* One card, rendered on its own so ticking a set can refresh just that card —
     records and the set tools depend on what was ticked, but a full re-render
     would tear down whatever the user is typing in elsewhere. */
  function exerciseCardHTML(s, ex) {
      var e = entryFor(s, ex);
      var last = lastFor(ex.id, s.key);
      var lastLine = "";
      if (last) {
        lastLine = '<div class="last">Last <b>' + esc(prettyDate(last.date)) + "</b> · " +
          last.sets.map(function (x) {
            return '<span class="num">' + esc(x.w || "–") + "×" + esc(x.r || "–") + "</span>";
          }).join(", ") + "</div>";
      }
      var rows = e.sets.map(function (st, i) {
        /* only carry a weight forward if it was logged the same way */
        var prefill = last && last.sets[i] && last.each === !!ex.each ? last.sets[i].w : "";
        var record = isRecordSet(s, ex.id, i);
        return '<div class="row' + (st.done ? " done" : "") + (record ? " pr" : "") +
          '" data-ex="' + ex.id + '" data-i="' + i + '">' +
          '<div class="idx num">' + (i + 1) + "</div>" +
          '<input type="number" inputmode="decimal" step="any" data-f="w" value="' + esc(st.w) + '" placeholder="' + esc(prefill || state.unit) + '" aria-label="Weight, set ' + (i + 1) + '">' +
          '<input type="number" inputmode="numeric" step="1" data-f="r" value="' + esc(st.r) + '" placeholder="reps" aria-label="Reps, set ' + (i + 1) + '">' +
          '<button class="tick" data-tick aria-label="Mark set ' + (i + 1) + ' done" aria-pressed="' + st.done + '">' + CHECK + "</button>" +
          "</div>" +
          (record
            ? '<div class="pr-flag">' + STAR + "Personal record · est. 1RM " +
              (Math.round(e1rm(st.w, st.r) * 10) / 10) + " " + esc(state.unit) +
              (ex.each ? " per hand" : "") + "</div>"
            : "");
      }).join("");

      return '<section class="card" data-card="' + ex.id + '">' +
        '<div class="card-head"><div>' +
          '<p class="ex-name">' + esc(ex.name) + "</p>" +
          '<div class="target num">' + ex.sets + " × " + esc(ex.reps) +
            '<span class="rest-tag">' + fmtRest(restOf(ex)) + " rest</span></div>" +
          (ex.note ? '<div class="note">' + esc(ex.note) + "</div>" : "") +
          lastLine +
        "</div></div>" +
        '<div class="rows">' +
          '<div class="colhead"><span>Set</span><span>' + esc(unitLabel(ex)) + "</span><span>Reps</span><span>Done</span></div>" +
          rows +
          '<div class="row-tools">' +
            '<button class="btn sm" data-addset="' + ex.id + '">+ Set</button>' +
            (e.sets.length > ex.sets ? '<button class="btn sm" data-rmset="' + ex.id + '">− Set</button>' : "") +
          "</div>" +
        "</div></section>";
  }

  function trainHTML(day) {
    var s = currentSession();
    var cards = day.ex.map(function (ex) { return exerciseCardHTML(s, ex); }).join("");

    var warn = store ? "" : '<div class="warn"><b>This browser is blocking storage.</b> Nothing you log will survive closing the page. Private browsing is the usual cause — open the app normally, or copy a backup from the Data tab before you leave.</div>';

    return warn +
      '<div class="sheet-head"><div><div class="eyebrow">Day ' + (state.program.indexOf(day) + 1) + " of " + state.program.length + "</div><h1>" + esc(day.name) + "</h1></div>" +
      '<button class="btn" data-edit>Edit</button></div>' + cards +
      '<button class="btn finish" data-finish>Finish workout</button>';
  }

  /* ---------- train interactions (no full re-render on typing) ---------- */
  viewEl.addEventListener("input", function (ev) {
    var inp = ev.target;
    if (inp.dataset.f) {
      var row = inp.closest(".row");
      var s = currentSession();
      var ex = getDay(state.day).ex.filter(function (x) { return x.id === row.dataset.ex; })[0];
      if (!ex) return;
      var e = entryFor(s, ex);
      var st = e.sets[Number(row.dataset.i)];
      if (!st) return;
      st[inp.dataset.f] = inp.value;
      save();
      updateProgress();
      return;
    }
    if (inp.dataset.p) { editField(inp); return; }

    if (inp.dataset.target) {
      var met = METRICS.filter(function (x) { return x.id === inp.dataset.target; })[0];
      var tv = parseFloat(inp.value);
      if (met && isFinite(tv) && tv > 0) { state.fuel.targets[met.id] = tv * met.per; save(); }
      return;
    }
  });

  viewEl.addEventListener("click", function (ev) {
    var t = ev.target;

    var tick = t.closest("[data-tick]");
    if (tick) {
      var row = tick.closest(".row");
      var s = currentSession();
      var ex = getDay(state.day).ex.filter(function (x) { return x.id === row.dataset.ex; })[0];
      if (!ex) return;
      var e = entryFor(s, ex);
      var st = e.sets[Number(row.dataset.i)];
      var wIn = row.querySelector('[data-f="w"]');
      var rIn = row.querySelector('[data-f="r"]');
      st.done = !st.done;
      if (st.done) {
        if (!s.firstSetAt) s.firstSetAt = Date.now();   /* the session really starts here */
        clearRestOver();
        if (!st.w && wIn.placeholder && wIn.placeholder !== state.unit) { st.w = wIn.placeholder; wIn.value = st.w; }
        if (!st.r) {
          var lo = String(ex.reps).match(/\d+/);
          if (lo) { st.r = lo[0]; rIn.value = st.r; }
        }
        /* Rest only while sets remain. */
        if (allDone(getDay(state.day), s)) stopTimer(); else startTimer(restOf(ex));
      }
      save();
      /* redraw this card only: whether a set is a record depends on the others */
      var card = tick.closest("[data-card]");
      if (card) card.outerHTML = exerciseCardHTML(s, ex);
      updateProgress();
      paintTimer();
      paintBottom();
      return;
    }

    var add = t.closest("[data-addset]");
    if (add) {
      var exA = getDay(state.day).ex.filter(function (x) { return x.id === add.dataset.addset; })[0];
      entryFor(currentSession(), exA).sets.push({ w: "", r: "", done: false });
      save();
      render();
      return;
    }

    var rm = t.closest("[data-rmset]");
    if (rm) {
      var eR = entryFor(currentSession(), getDay(state.day).ex.filter(function (x) { return x.id === rm.dataset.rmset; })[0]);
      eR.sets.pop();
      save();
      render();
      return;
    }

    if (t.closest("[data-finish]")) { finishWorkout(); return; }
    if (t.closest("[data-edit]")) { ui.edit = true; render(); return; }
    if (t.closest("[data-doneedit]")) { ui.edit = false; render(); return; }

    handleFuelClick(t);
    handleFriendsClick(t);
    handleEditClick(t);
    handleDataClick(t);
    handleHistoryClick(t);
  });

  /* targets re-score every logged day, so redraw once the field settles */
  viewEl.addEventListener("change", function (ev) {
    if (ev.target.dataset && ev.target.dataset.target) render();
  });

  /* ---------- edit program ---------- */
  function editHTML(day) {
    var cards = day.ex.map(function (ex, i) {
      return '<section class="card"><div class="edit-card" data-ex="' + ex.id + '">' +
        '<div class="edit-grid">' +
          '<input class="f strong" data-p="name" value="' + esc(ex.name) + '" aria-label="Exercise name">' +
          '<div class="edit-pair">' +
            '<input class="f mono" data-p="sets" type="number" inputmode="numeric" min="1" max="12" value="' + ex.sets + '" aria-label="Sets">' +
            '<input class="f" data-p="reps" value="' + esc(ex.reps) + '" aria-label="Rep range">' +
          "</div>" +
          '<input class="f" data-p="note" value="' + esc(ex.note || "") + '" placeholder="Note (optional)" aria-label="Note">' +
        "</div>" +
        '<div class="lab">Rest between sets</div>' +
        '<div class="segs">' + REST_CHOICES.map(function (r) {
          return '<button class="btn sm" data-exrest="' + r + '" aria-pressed="' + (restOf(ex) === r) + '">' + fmtRest(r) + "</button>";
        }).join("") + "</div>" +
        '<div class="lab">Weight entered as</div>' +
        '<div class="segs">' +
          '<button class="btn sm" data-exeach="0" aria-pressed="' + (!ex.each) + '">Total lifted</button>' +
          '<button class="btn sm" data-exeach="1" aria-pressed="' + (!!ex.each) + '">Per dumbbell</button>' +
        "</div>" +
        '<div class="edit-tools">' +
          '<button class="btn sm" data-move="up" ' + (i === 0 ? "disabled" : "") + ">↑</button>" +
          '<button class="btn sm" data-move="down" ' + (i === day.ex.length - 1 ? "disabled" : "") + ">↓</button>" +
          '<button class="btn sm danger" data-delex>Remove</button>' +
        "</div></div></section>";
    }).join("");

    return '<div class="sheet-head"><div><div class="eyebrow">Editing</div><h1>' + esc(day.name) + "</h1></div>" +
      '<button class="btn day" data-doneedit>Done</button></div>' +
      '<section class="card"><div class="edit-card">' +
        '<div class="lab">Day name</div>' +
        '<input class="f strong" data-p="dayname" value="' + esc(day.name) + '" aria-label="Day name">' +
        '<div class="lab">Plate colour</div>' +
        '<div class="segs">' + COLORS.map(function (c) {
          return '<button class="btn sm" data-color="' + c + '" aria-pressed="' + (c === day.color) + '" style="--day: var(--plate-' + c + ')">' +
            c.charAt(0).toUpperCase() + c.slice(1) + "</button>";
        }).join("") + "</div>" +
      "</div></section>" +
      cards +
      '<button class="btn ghost" data-addex>+ Add exercise</button>' +
      shareCardHTML(day) +
      '<div class="segs"><button class="btn" data-addday>+ Add training day</button>' +
      (state.program.length > 1 ? '<button class="btn danger" data-delday>Delete day</button>' : "") + "</div>";
  }

  function shareCardHTML(day) {
    if (!auth || !auth.handle) return "";
    var friends = (state.social.links || []).filter(function (l) { return l.status === "accepted"; });
    if (!friends.length) return "";

    return '<section class="card"><div class="edit-card">' +
      '<div class="lab">Send this day to a friend</div>' +
      '<p class="hint">They get a copy they can accept. Change it later and send again — they are offered an update, and anything they have already logged against it stays attached.</p>' +
      friends.map(function (l) {
        var fid = otherSide(l);
        var sent = (state.social.sentShares || []).filter(function (x) {
          return x.recipient_id === fid && x.day_key === day.id;
        })[0];
        return '<div class="share-row" style="background:none;border-top:0;padding:6px 0">' +
          "<span>" + esc(nameOf(fid)) + (sent ? " · sent v" + sent.version : "") + "</span>" +
          '<button class="btn sm" data-shareday="' + esc(fid) + '">' + (sent ? "Send update" : "Send") + "</button>" +
        "</div>";
      }).join("") +
      (social.shareMsg ? '<p class="hint" style="color:var(--plate-green)">' + esc(social.shareMsg) + "</p>" : "") +
      (social.error ? '<p class="hint" style="color:var(--plate-red)">' + esc(social.error) + "</p>" : "") +
    "</div></section>";
  }

  function editField(inp) {
    var day = getDay(state.day);
    if (inp.dataset.p === "dayname") { day.name = inp.value; save(); renderDays(); return; }
    var wrap = inp.closest("[data-ex]");
    if (!wrap) return;
    var ex = day.ex.filter(function (x) { return x.id === wrap.dataset.ex; })[0];
    if (!ex) return;
    if (inp.dataset.p === "sets") ex.sets = Math.max(1, Math.min(12, parseInt(inp.value, 10) || 1));
    else ex[inp.dataset.p] = inp.value;
    save();
  }

  function handleEditClick(t) {
    var day = getDay(state.day);

    var col = t.closest("[data-color]");
    if (col) { day.color = col.dataset.color; save(); render(); return; }

    var xr = t.closest("[data-exrest]");
    if (xr) {
      var wrapR = xr.closest("[data-ex]");
      var exR = day.ex.filter(function (x) { return x.id === wrapR.dataset.ex; })[0];
      if (exR) { exR.rest = Number(xr.dataset.exrest); save(); render(); }
      return;
    }

    var sd = t.closest("[data-shareday]");
    if (sd) { shareDay(day, sd.dataset.shareday); return; }

    var xe = t.closest("[data-exeach]");
    if (xe) {
      var wrapE = xe.closest("[data-ex]");
      var exE = day.ex.filter(function (x) { return x.id === wrapE.dataset.ex; })[0];
      if (exE) { exE.each = xe.dataset.exeach === "1"; save(); render(); }
      return;
    }

    var mv = t.closest("[data-move]");
    if (mv) {
      var idm = mv.closest("[data-ex]").dataset.ex;
      var i = day.ex.findIndex(function (x) { return x.id === idm; });
      var j = mv.dataset.move === "up" ? i - 1 : i + 1;
      if (j < 0 || j >= day.ex.length) return;
      var tmp = day.ex[i]; day.ex[i] = day.ex[j]; day.ex[j] = tmp;
      save(); render(); return;
    }

    if (t.closest("[data-delex]")) {
      var idd = t.closest("[data-ex]").dataset.ex;
      var ex = day.ex.filter(function (x) { return x.id === idd; })[0];
      if (!confirm("Remove " + ex.name + " from " + day.name + "? Past logs are kept in History.")) return;
      day.ex = day.ex.filter(function (x) { return x.id !== idd; });
      save(); render(); return;
    }

    if (t.closest("[data-addex]")) {
      day.ex.push({ id: uid("x"), name: "New exercise", sets: 3, reps: "8–12", note: "", rest: state.rest });
      save(); render();
      var cards = viewEl.querySelectorAll('input[data-p="name"]');
      if (cards.length) { var lastIn = cards[cards.length - 1]; lastIn.focus(); lastIn.select(); }
      return;
    }

    if (t.closest("[data-addday]")) {
      var nd = { id: uid("d"), name: "Day " + (state.program.length + 1), color: COLORS[state.program.length % 4], ex: [] };
      state.program.push(nd);
      state.day = nd.id;
      save(); render(); return;
    }

    if (t.closest("[data-delday]")) {
      if (state.program.length < 2) return;
      if (!confirm("Delete " + day.name + "? Past logs are kept in History.")) return;
      state.program = state.program.filter(function (d) { return d.id !== day.id; });
      state.day = state.program[0].id;
      ui.edit = false;
      save(); render(); return;
    }
  }

  /* ---------- fuel ---------- */
  function fuelDay(date) {
    if (!state.fuel.days[date]) state.fuel.days[date] = {};
    var d = state.fuel.days[date];
    METRICS.forEach(function (m) { if (!Array.isArray(d[m.id])) d[m.id] = []; });
    return d;
  }

  /* Entries used to be bare numbers. They now carry the moment they were
     logged, so the feed can say when a goal was actually reached. */
  function entryAmount(e) { return Number(e && typeof e === "object" ? e.v : e) || 0; }
  function entryTime(e) { return (e && typeof e === "object" && Number(e.t)) || 0; }

  function fuelTotal(date, id) {
    var arr = (state.fuel.days[date] || {})[id];
    return Array.isArray(arr) ? arr.reduce(function (a, e) { return a + entryAmount(e); }, 0) : 0;
  }

  function fuelHit(date, id) { return fuelTotal(date, id) >= state.fuel.targets[id]; }

  /* When the running total first crossed the target. Zero if the entry that
     crossed it predates timestamps. */
  function fuelHitAt(date, id) {
    var arr = (state.fuel.days[date] || {})[id];
    if (!Array.isArray(arr)) return 0;
    var target = state.fuel.targets[id], running = 0;
    for (var i = 0; i < arr.length; i++) {
      running += entryAmount(arr[i]);
      if (running >= target) return entryTime(arr[i]);
    }
    return 0;
  }

  /* Trim trailing zeros so 1500 ml reads "1.5" and 3000 reads "3". */
  function fuelNum(m, value) {
    var n = value / m.per;
    return String(Math.round(n * 100) / 100);
  }

  function dateOffset(days) {
    var d = new Date();
    d.setDate(d.getDate() + days);
    var mo = String(d.getMonth() + 1).padStart(2, "0");
    var da = String(d.getDate()).padStart(2, "0");
    return { key: d.getFullYear() + "-" + mo + "-" + da, initial: "SMTWTFS".charAt(d.getDay()) };
  }

  function fuelHTML() {
    var today = todayKey();
    var hits = METRICS.filter(function (m) { return fuelHit(today, m.id); }).length;

    var cards = METRICS.map(function (m) {
      var total = fuelTotal(today, m.id);
      var target = state.fuel.targets[m.id];
      var pct = Math.min(100, target > 0 ? (total / target) * 100 : 0);
      var hit = total >= target;
      var left = Math.max(0, target - total);
      var logged = (state.fuel.days[today] || {})[m.id] || [];

      return '<section class="card m-' + m.id + '"><div class="fuel-card">' +
        '<div class="fuel-head">' +
          '<div class="fuel-name"><span class="fuel-dot"></span>' + m.name + "</div>" +
          '<div class="fuel-val"><b>' + fuelNum(m, total) + "</b> / " + fuelNum(m, target) + " " + m.unit + "</div>" +
        "</div>" +
        '<div class="meter" role="img" aria-label="' + m.name + " " + fuelNum(m, total) + " of " + fuelNum(m, target) + " " + m.unit +
          '"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
        '<div class="fuel-foot">' +
          (hit
            ? '<span class="fuel-hit">' + CHECK + " Goal hit</span>"
            : '<span class="fuel-left">' + fuelNum(m, left) + " " + m.unit + " to go</span>") +
          (logged.length ? '<button class="fuel-undo" data-undo="' + m.id + '">Undo last</button>' : "<span></span>") +
        "</div>" +
        '<div class="quick">' + m.quick.map(function (q) {
          return '<button class="btn sm" data-add="' + m.id + '" data-amt="' + q + '">+' + q + (m.inputUnit || m.unit) + "</button>";
        }).join("") + "</div>" +
        '<div class="custom">' +
          '<input type="number" inputmode="decimal" step="' + m.step + '" data-amtfor="' + m.id +
            '" placeholder="Other (' + (m.inputUnit || m.unit) + ')" aria-label="Custom ' + m.name + ' amount">' +
          '<button class="btn" data-addcustom="' + m.id + '">Add</button>' +
        "</div>" +
      "</div></section>";
    }).join("");

    /* seven days ending today; filled dot = target met */
    var week = [];
    for (var i = -6; i <= 0; i++) week.push(dateOffset(i));
    var streak =
      '<section class="card"><div class="fuel-card">' +
        '<div class="lab">Last 7 days</div>' +
        '<div class="week">' +
          "<span></span>" + week.map(function (d) { return '<span class="week-h">' + d.initial + "</span>"; }).join("") +
          METRICS.map(function (m) {
            return '<span class="week-l">' + m.name + "</span>" +
              week.map(function (d) {
                return '<span class="m-' + m.id + '"><i class="' + (fuelHit(d.key, m.id) ? "on" : "") +
                  '" title="' + m.name + " " + d.key + '"></i></span>';
              }).join("");
          }).join("") +
        "</div>" +
      "</div></section>";

    var targets =
      '<section class="card"><div class="fuel-card">' +
        '<div class="lab">Daily targets</div>' +
        METRICS.map(function (m) {
          return '<div class="edit-pair">' +
            '<input class="f mono" type="number" inputmode="decimal" step="' + m.step + '" data-target="' + m.id +
              '" value="' + fuelNum(m, state.fuel.targets[m.id]) + '" aria-label="' + m.name + ' target">' +
            '<div class="f" style="display:flex;align-items:center;border:0;background:none;padding-left:2px">' +
              m.name + " <span class=\"per-hand\" style=\"margin-left:6px\">" + m.unit + " a day</span></div>" +
          "</div>";
        }).join("") +
        '<p class="hint">Changing a target re-scores every day, including the ones already logged.</p>' +
      "</div></section>";

    return '<div class="sheet-head"><div><div class="eyebrow">' + hits + " of " + METRICS.length +
      ' goals hit today</div><h1>Fuel</h1></div></div>' + cards + streak + targets;
  }

  function handleFuelClick(t) {
    var add = t.closest("[data-add]");
    if (add) { addFuel(add.dataset.add, Number(add.dataset.amt)); return; }

    var custom = t.closest("[data-addcustom]");
    if (custom) {
      var id = custom.dataset.addcustom;
      var input = viewEl.querySelector('[data-amtfor="' + id + '"]');
      var v = parseFloat(input.value);
      if (!isFinite(v) || v === 0) { input.focus(); return; }
      addFuel(id, v);
      return;
    }

    var undo = t.closest("[data-undo]");
    if (undo) {
      var arr = fuelDay(todayKey())[undo.dataset.undo];
      arr.pop();
      save();
      render();
      return;
    }
  }

  function addFuel(id, amount) {
    if (!isFinite(amount) || amount === 0) return;
    fuelDay(todayKey())[id].push({ v: amount, t: Date.now() });
    save();
    render();
    queueSync();
  }

  /* ---------- finishing a workout ---------- */
  function finishWorkout() {
    var day = getDay(state.day);
    var s = currentSession();
    var done = doneCount(s);

    if (!done) {
      alert("Nothing logged yet — tick at least one set before finishing " + day.name + ".");
      return;
    }

    var left = plannedSets(day, s) - done;
    if (left > 0) {
      var msg = left === 1 ? "1 set isn't ticked." : left + " sets aren't ticked.";
      if (!confirm(msg + "\n\nFinish " + day.name + " anyway? It goes to History as it stands.")) return;
    }

    s.finished = true;
    s.finishedAt = Date.now();
    save();
    stopTimer();
    timerDay = null;
    render();      /* opens a fresh session for the same day */
    showSummary(s);
    queueSync();
  }

  function prevSessionFor(dayId, exceptKey) {
    var best = null;
    for (var k in state.sessions) {
      if (k === exceptKey) continue;
      var s = state.sessions[k];
      if (s.dayId !== dayId || doneCount(s) === 0) continue;
      if (isLater(s, best)) best = s;
    }
    return best;
  }

  function repsOf(session) {
    var n = 0;
    for (var id in session.entries) {
      session.entries[id].sets.forEach(function (x) { if (x.done) n += parseFloat(x.r) || 0; });
    }
    return n;
  }

  function showSummary(session) {
    var key = session.key;
    var vol = Math.round(volumeOf(session));
    var records = recordsIn(session);
    var prev = prevSessionFor(session.dayId, key);
    var line;
    if (!prev) {
      line = "First time through this day — every session after it gets measured against this one.";
    } else {
      var delta = vol - Math.round(volumeOf(prev));
      var when = prettyDate(prev.date);
      when = esc(when === "Yesterday" || when === "Today" ? when.toLowerCase() : when);
      if (delta > 0) line = "<b>Up " + delta.toLocaleString() + " " + state.unit + "</b> from " + when + ".";
      else if (delta < 0) line = "<b>Down " + Math.abs(delta).toLocaleString() + " " + state.unit + "</b> from " + when + ".";
      else line = "<b>Level</b> with " + when + ".";
    }

    var scrim = document.createElement("div");
    scrim.className = "scrim";
    scrim.innerHTML =
      '<div class="done-card" role="dialog" aria-modal="true" aria-labelledby="doneTitle">' +
        '<div><div class="eyebrow">Session complete' +
          (sessionMinutes(session) ? " \u00b7 " + fmtMinutes(sessionMinutes(session)) : "") +
        '</div><h2 id="doneTitle">' + esc(session.dayName) + "</h2></div>" +
        '<div class="done-stats">' +
          "<div><b>" + doneCount(session) + "</b><span>Sets</span></div>" +
          "<div><b>" + Math.round(repsOf(session)).toLocaleString() + "</b><span>Reps</span></div>" +
          "<div><b>" + vol.toLocaleString() + "</b><span>" + state.unit + " volume</span></div>" +
        "</div>" +
        '<p class="done-delta">' + line + "</p>" +
        (records.length
          ? '<div class="done-prs"><div class="lab">' +
              (records.length === 1 ? "New record" : records.length + " new records") + "</div>" +
              records.map(function (r) {
                return '<div class="done-pr">' + STAR + "<span><b>" + esc(r.name) + "</b> · " +
                  esc(r.w) + " × " + esc(r.r) + (r.each ? " per hand" : "") + "</span></div>";
              }).join("") +
            "</div>"
          : "") +
        '<div class="segs">' +
          '<button class="btn day" data-doneclose>Done</button>' +
          '<button class="btn" data-donehistory>See history</button>' +
        "</div>" +
      "</div>";
    appEl.appendChild(scrim);

    function close() {
      if (scrim.parentNode) scrim.parentNode.removeChild(scrim);
      document.removeEventListener("keydown", onKey);
    }
    function onKey(ev) { if (ev.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);

    scrim.addEventListener("click", function (ev) {
      if (ev.target === scrim || ev.target.closest("[data-doneclose]")) { close(); return; }
      if (ev.target.closest("[data-donehistory]")) {
        close();
        ui.view = "history";
        ui.openSession = key;
        render();
      }
    });

    var first = scrim.querySelector("[data-doneclose]");
    if (first) first.focus();
  }

  /* ---------- history ---------- */
  function historyHTML() {
    var keys = Object.keys(state.sessions).filter(function (k) { return doneCount(state.sessions[k]) > 0; });
    keys.sort(function (a, b) {
      var A = state.sessions[a], B = state.sessions[b];
      if (A.date !== B.date) return B.date.localeCompare(A.date);
      return (B.startedAt || 0) - (A.startedAt || 0);
    });

    if (!keys.length) {
      return '<div class="empty"><b>No sessions yet</b>Tick your first set on the Train tab and it lands here.</div>';
    }

    return '<div class="sheet-head"><div><div class="eyebrow">' + keys.length + ' session' + (keys.length === 1 ? "" : "s") + '</div><h1>History</h1></div></div>' +
      keys.map(function (k) {
        var s = state.sessions[k];
        var open = ui.openSession === k;
        var body = "";

        if (open) {
          var lines = [];
          var prIds = {};
          recordsIn(s).forEach(function (r) { prIds[r.exId] = true; });
          for (var id in s.entries) {
            var e = s.entries[id];
            var d = e.sets.filter(function (x) { return x.done; });
            if (!d.length) continue;
            lines.push(
              '<div class="hist-ex">' +
                '<span class="hist-name">' + (prIds[id] ? '<span class="hist-pr">' + STAR + "</span>" : "") + esc(e.name) +
                  (e.each ? "<em>per hand</em>" : "") + "</span>" +
                '<span class="hist-sets">' + d.map(function (x) {
                  return "<i>" + esc(x.w || "–") + "×" + esc(x.r || "–") + "</i>";
                }).join("") + "</span>" +
              "</div>"
            );
          }
          body = '<div class="hist-body">' + lines.join("") +
            '<button class="btn sm danger" data-delsession="' + esc(k) + '">Delete this session</button></div>';
        }

        /* --c sits on the card so the expanded body can use it too */
        return '<section class="card" style="--c: var(--plate-' + (s.color || "blue") + ')">' +
          '<button class="hist" data-session="' + esc(k) + '">' +
            '<span class="bar"></span>' +
            '<span class="hist-main">' +
              "<b>" + esc(s.dayName) + "</b>" +
              '<span class="hist-sub">' + esc(prettyDate(s.date)) + " · " + doneCount(s) + " sets" +
                (sessionMinutes(s) ? " · " + esc(fmtMinutes(sessionMinutes(s))) : "") +
                (s.finished ? "" : '<span class="chip-live">In progress</span>') + "</span>" +
            "</span>" +
            '<span class="hist-vol"><b>' + Math.round(volumeOf(s)).toLocaleString() + "</b><span>" + esc(state.unit) + "</span></span>" +
          "</button>" + body + "</section>";
      }).join("");
  }

  function handleHistoryClick(t) {
    var del = t.closest("[data-delsession]");
    if (del) {
      if (!confirm("Delete this session permanently?")) return;
      delete state.sessions[del.dataset.delsession];
      ui.openSession = null;
      save(); render(); return;
    }
    var h = t.closest("[data-session]");
    if (h) {
      ui.openSession = ui.openSession === h.dataset.session ? null : h.dataset.session;
      render();
    }
  }

  /* ---------- data ---------- */
  var downloads = null;
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(function (d) {
      downloads = d;
      if (d && ui.view === "data") render();
    }).catch(function () {});
  }

  function dataHTML() {
    var sessions = Object.keys(state.sessions).filter(function (k) { return doneCount(state.sessions[k]) > 0; }).length;
    return '<div class="sheet-head"><div><div class="eyebrow">Backup &amp; settings</div><h1>Data</h1></div></div>' +
      accountHTML() +
      '<section class="card"><div class="edit-card">' +
        '<div class="lab">Appearance</div>' +
        '<div class="segs">' + [["system", "System"], ["light", "Light"], ["dark", "Dark"]].map(function (t) {
          return '<button class="btn" data-settheme="' + t[0] + '" aria-pressed="' + (state.theme === t[0]) + '">' + t[1] + "</button>";
        }).join("") + "</div>" +
        '<p class="hint">System follows whatever your phone is set to, including its night schedule.</p>' +
      "</div></section>" +

      '<section class="card"><div class="edit-card">' +
        '<div class="lab">Weight unit</div>' +
        '<div class="segs"><button class="btn" data-unit="kg" aria-pressed="' + (state.unit === "kg") + '">Kilograms</button>' +
        '<button class="btn" data-unit="lb" aria-pressed="' + (state.unit === "lb") + '">Pounds</button></div>' +
        '<div class="lab" style="margin-top:6px">Rest alarm</div>' +
        '<div class="segs">' +
          '<button class="btn" data-sound="1" aria-pressed="' + (state.sound !== false) + '">Sound on</button>' +
          '<button class="btn" data-sound="0" aria-pressed="' + (state.sound === false) + '">Silent</button>' +
        "</div>" +
        '<p class="hint">A chime when the rest timer runs out. The banner appears either way.</p>' +
        '<div class="lab" style="margin-top:6px">Default rest</div>' +
        '<p class="hint">Every exercise carries its own rest — 3:00 on the compounds, 1:30 on the isolation work — and you change it under <b>Edit</b> on any day. This one only covers exercises you add yourself and a bare tap on the timer button.</p>' +
        '<div class="segs">' + [60, 90, 120, 180].map(function (r) {
          return '<button class="btn" data-rest="' + r + '" aria-pressed="' + (state.rest === r) + '">' + fmtRest(r) + "</button>";
        }).join("") + "</div>" +
      "</div></section>" +

      '<section class="card"><div class="edit-card">' +
        '<div class="lab">Backup</div>' +
        '<p class="hint">' + sessions + " logged session" + (sessions === 1 ? "" : "s") + " on this phone" +
          (auth ? ", mirrored to your account." : " and nowhere else — signing in adds a cloud copy.") +
          ' A text backup depends on nothing at all, so it is worth taking now and again.</p>' +
        '<div class="segs"><button class="btn" data-copy>Copy backup</button>' +
        (downloads ? '<button class="btn" data-download>Download file</button>' : "") + "</div>" +
        '<div class="lab" style="margin-top:6px">Restore</div>' +
        '<textarea class="f" id="restoreBox" placeholder="Paste a backup here" aria-label="Backup text"></textarea>' +
        '<button class="btn" data-restore>Restore from text</button>' +
      "</div></section>" +

      '<section class="card"><div class="edit-card">' +
        '<div class="lab">Version</div>' +
        '<p class="hint">You are running <b class="num">' + VERSION + '</b>. New versions install themselves in the background, but only take effect the next time you open the app — this button does it now.</p>' +
        '<button class="btn" data-update>Check for updates</button>' +
      "</div></section>" +

      '<section class="card"><div class="edit-card">' +
        '<div class="lab">Reset</div>' +
        '<p class="hint">Puts the starting upper/lower split back as it shipped, losing any days you have added or edited. Your logged sessions are untouched.</p>' +
        '<button class="btn danger" data-resetprog>Reset program to default</button>' +
        '<button class="btn danger" data-wipe>Erase everything</button>' +
      "</div></section>";
  }

  function applyTheme() {
    if (state.theme === "light" || state.theme === "dark") {
      document.documentElement.setAttribute("data-theme", state.theme);
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
  }

  function handleDataClick(t) {
    if (handleAccountClick(t)) return;

    /* NOT [data-theme]: applyTheme() stamps that on <html>, so closest() would
       match the document root from any click and swallow every other button. */
    var th = t.closest("[data-settheme]");
    if (th) { state.theme = th.dataset.settheme; applyTheme(); save(); render(); return; }

    if (t.closest("[data-update]")) {
      var ub = t.closest("[data-update]");
      ub.textContent = "Checking…";
      if (!("serviceWorker" in navigator)) { location.reload(); return; }
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (!reg) { location.reload(); return; }
        reg.addEventListener("updatefound", function () {
          var sw = reg.installing;
          if (!sw) return;
          sw.addEventListener("statechange", function () {
            if (sw.state === "activated" || sw.state === "redundant") location.reload();
          });
        });
        reg.update();
        setTimeout(function () { ub.textContent = "Already up to date"; }, 4000);
      }).catch(function () { ub.textContent = "Check failed — try again with a signal"; });
      return;
    }

    var u = t.closest("[data-unit]");
    if (u) { state.unit = u.dataset.unit; save(); render(); return; }

    var snd = t.closest("[data-sound]");
    if (snd) {
      state.sound = snd.dataset.sound === "1";
      save();
      if (state.sound) { primeAudio(); ding(); }   /* let them hear what they chose */
      render();
      return;
    }

    var r = t.closest("[data-rest]");
    if (r) { state.rest = Number(r.dataset.rest); save(); render(); return; }

    if (t.closest("[data-copy]")) {
      var text = JSON.stringify(state);
      var btn = t.closest("[data-copy]");
      var done = function (ok) { btn.textContent = ok ? "Copied" : "Copy failed"; setTimeout(function () { btn.textContent = "Copy backup"; }, 1600); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done(true); }, function () { showFallback(text); });
      } else showFallback(text);
      return;
    }

    if (t.closest("[data-download]")) {
      if (!downloads) return;
      var b = t.closest("[data-download]");
      downloads.save({ filename: "plate-ledger-" + todayKey() + ".json", data: JSON.stringify(state, null, 2) })
        .then(function () { b.textContent = "Saved"; setTimeout(function () { b.textContent = "Download file"; }, 1600); })
        .catch(function () { b.textContent = "Not saved"; setTimeout(function () { b.textContent = "Download file"; }, 1600); });
      return;
    }

    if (t.closest("[data-restore]")) {
      var box = document.getElementById("restoreBox");
      var raw = box.value.trim();
      if (!raw) return;
      try {
        var parsed = JSON.parse(raw);
        if (!parsed.program || !parsed.sessions) throw new Error("shape");
        state = {
          v: 1,
          program: normalize(parsed.program),
          sessions: normalizeSessions(parsed.sessions),
          fuel: normalizeFuel(parsed.fuel),
          cloud: normalizeCloud(parsed.cloud),
          social: normalizeSocial(parsed.social),
          unit: parsed.unit === "lb" ? "lb" : "kg",
          rest: typeof parsed.rest === "number" ? parsed.rest : 120,
          sound: parsed.sound !== false,
          theme: parsed.theme || "system",
          day: parsed.day || parsed.program[0].id
        };
        save();
        ui.view = "train";
        render();
      } catch (e) {
        box.value = "";
        box.placeholder = "That text isn't a Plate Ledger backup — paste the whole thing, starting with {";
      }
      return;
    }

    if (t.closest("[data-resetprog]")) {
      if (!confirm("Reset the program to the one it shipped with? Days you have added or edited are lost.")) return;
      state.program = defaultProgram();
      state.day = "d1";
      save(); render(); return;
    }

    if (t.closest("[data-wipe]")) {
      if (!confirm("Erase the program and every logged session? This cannot be undone.")) return;
      state = defaultState();
      save(); render(); return;
    }
  }

  function showFallback(text) {
    var box = document.getElementById("restoreBox");
    if (!box) return;
    box.value = text;
    box.focus();
    box.select();
  }

  /* ---------- cloud ----------
     Hand-rolled rather than pulling the Supabase SDK off a CDN: the service
     worker caches this page for offline use, and a CDN script would be the one
     thing that breaks in a basement gym. The key below is publishable by
     design — row-level security is what protects the data, not secrecy. */
  var SUPABASE_URL = "https://kjaoltyumjmcunyvhmvb.supabase.co";
  var SUPABASE_KEY = "sb_publishable_W6FZMbAqfJLRBVOekrDnmA_cv3mFMMY";
  var AUTH_KEY = "plate-ledger-auth";

  var auth = null;
  var sync = { busy: false, error: null };
  var social = { busy: false, error: null, friendData: null };

  function loadAuth() {
    if (!store) return null;
    try { return JSON.parse(store.getItem(AUTH_KEY)); } catch (e) { return null; }
  }

  function saveAuth() {
    if (!store) return;
    if (auth) store.setItem(AUTH_KEY, JSON.stringify(auth));
    else store.removeItem(AUTH_KEY);
  }

  function api(path, opts) {
    opts = opts || {};
    var headers = { apikey: SUPABASE_KEY, "Content-Type": "application/json" };
    headers.Authorization = "Bearer " + (opts.anon ? SUPABASE_KEY : (auth && auth.access_token) || SUPABASE_KEY);
    if (opts.prefer) headers.Prefer = opts.prefer;
    return fetch(SUPABASE_URL + path, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined
    }).then(function (res) {
      return res.text().then(function (txt) {
        var data = null;
        try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = txt; }
        if (!res.ok) {
          var msg = (data && (data.msg || data.message || data.error_description || data.error)) || ("Request failed (" + res.status + ")");
          var err = new Error(msg);
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  /* Access tokens last an hour; trade the refresh token in before they lapse. */
  function withSession() {
    if (!auth) return Promise.reject(new Error("Not signed in"));
    if (auth.expires_at && Date.now() < auth.expires_at - 60000) return Promise.resolve();
    return api("/auth/v1/token?grant_type=refresh_token", {
      method: "POST", anon: true, body: { refresh_token: auth.refresh_token }
    }).then(function (d) {
      auth.access_token = d.access_token;
      auth.refresh_token = d.refresh_token;
      auth.expires_at = Date.now() + (d.expires_in || 3600) * 1000;
      saveAuth();
    });
  }

  function adoptSession(d) {
    auth = {
      access_token: d.access_token,
      refresh_token: d.refresh_token,
      expires_at: Date.now() + (d.expires_in || 3600) * 1000,
      user_id: d.user.id,
      email: d.user.email,
      handle: ""
    };
    saveAuth();
    return api("/rest/v1/profiles?id=eq." + auth.user_id + "&select=handle,display_name")
      .then(function (rows) {
        if (rows && rows.length) { auth.handle = rows[0].handle; saveAuth(); }
      });

  function signUp(email, password) {
    return api("/auth/v1/signup", { method: "POST", anon: true, body: { email: email, password: password } })
      .then(function (d) {
        if (d && d.access_token) return adoptSession(d);
        /* confirmation is on: no session until the link is clicked */
        throw new Error("Account created — confirm the email, then sign in.");
      });
  }

  function signIn(email, password) {
    return api("/auth/v1/token?grant_type=password",
               { method: "POST", anon: true, body: { email: email, password: password } })
      .then(adoptSession)
      .catch(function (err) {
        /* The server answers "Invalid login credentials" whether the password
           is wrong OR the address has no account — deliberately, so nobody can
           probe for registered emails. Repeating that verbatim sends people
           hunting for a password problem when the address is the culprit. */
        if (/invalid.*credential|invalid_grant/i.test(err.message || "")) {
          throw new Error("No account matches that email and password. Check the email first — a wrong address looks exactly like a wrong password here.");
        }
        throw err;

  function signOut() {

  function claimHandle(handle) {

        body: [{ id: auth.user_id, handle: handle, display_name: handle }]

  /* ---- what gets pushed ---- */
  function syncableSessions() {
    var out = [];
    for (var k in state.sessions) {
      var s = state.sessions[k];
      if (s.finished && doneCount(s) > 0) out.push(s);
    }
    return out;
  }

  function sessionRow(s) {
    return {
      user_id: auth.user_id,
      client_key: s.key,
      day_id: s.dayId,
      day_name: s.dayName,
      color: s.color || null,
      date: s.date,
      started_at: s.startedAt ? new Date(s.startedAt).toISOString() : null,
      first_set_at: s.firstSetAt ? new Date(s.firstSetAt).toISOString() : null,
      finished_at: s.finishedAt ? new Date(s.finishedAt).toISOString() : null,
      sets_done: doneCount(s),
      volume: Math.round(volumeOf(s) * 100) / 100,
      unit: state.unit
    };
  }

  /* Opening a day creates an entry for every exercise on it, most of them
     empty. Only what was actually logged is worth storing — or showing to a
     friend who has been given detail access. */
  function detailEntries(s) {
    var out = {};
    for (var id in s.entries) {
      var e = s.entries[id];
      var done = e.sets.filter(function (x) { return x.done; });
      if (!done.length) continue;
      out[id] = { name: e.name, each: !!e.each, sets: done };
    }
    return out;
  }

  function recordRows() {
    var seen = {}, out = [];
    for (var k in state.sessions) {
      var s = state.sessions[k];
      if (!s.finished) continue;
      recordsIn(s).forEach(function (r) {
        /* the unique key is (exercise, date, weight, reps) — a repeat in one
           payload would make the upsert touch a row twice and fail */
        var id = [r.name, s.date, r.w, r.r].join("|");
        if (seen[id]) return;
        seen[id] = true;
        out.push({
          user_id: auth.user_id, exercise: r.name,
          weight: parseFloat(r.w) || 0, reps: parseFloat(r.r) || 0,
          e1rm: Math.round(r.e1rm * 100) / 100, unit: state.unit,
          per_hand: !!r.each, achieved_on: s.date
        });
      });
    }
    return out;
  }

  function fuelRows() {
    var out = [];
    for (var date in state.fuel.days) {
      var total = METRICS.map(function (m) { return fuelTotal(date, m.id); });
      if (!total.some(function (n) { return n > 0; })) continue;
      out.push({
        user_id: auth.user_id, date: date,
        protein: total[0], creatine: total[1], water: total[2],
        target_protein: state.fuel.targets.protein,
        target_creatine: state.fuel.targets.creatine,
        target_water: state.fuel.targets.water
      });
    }
    return out;
  }

  /* ---- the program itself ----
     One document, last edit wins. The trap is a phone that has just signed in:
     its program is the untouched default, and pushing that would wipe the real
     one. So local edits are timestamped, and whichever side is newer wins —
     which makes a fresh device pull rather than clobber. */
  function programJSON() { return JSON.stringify(state.program); }

  function isUntouchedProgram() {
    return programJSON() === JSON.stringify(normalize(defaultProgram()));
  }

  function syncProgram() {
    if (!state.cloud.programSnap) {
      /* First sync from this device. There is no snapshot to compare against,
         so "has it changed?" is the wrong question — an untouched default must
         count as old, or signing in on a new phone would push the starter
         program over the real one. Something actually built here counts as new. */
      state.cloud.programAt = isUntouchedProgram() ? 0 : Date.now();
    } else if (programJSON() !== state.cloud.programSnap) {
      state.cloud.programAt = Date.now();   /* edited since the last sync */
    }

    return api("/rest/v1/programs?user_id=eq." + auth.user_id + "&select=days,updated_at")
      .then(function (rows) {
        var remote = rows && rows[0];
        var remoteAt = remote ? Date.parse(remote.updated_at) : 0;
        var remoteDays = (remote && Array.isArray(remote.days)) ? remote.days : [];

        /* never let an empty or older cloud copy overwrite what is in hand */
        if (remoteDays.length && remoteAt > (state.cloud.programAt || 0)) {
          state.program = normalize(remoteDays);
          if (!getDay(state.day)) state.day = state.program[0] && state.program[0].id;
          state.cloud.programAt = remoteAt;
          state.cloud.programSnap = programJSON();
          save();
          timerDay = null;
          render();
          return;
        }

        return api("/rest/v1/programs?on_conflict=user_id", {
          method: "POST", prefer: "resolution=merge-duplicates,return=minimal",
          body: [{
            user_id: auth.user_id,
            days: state.program,
            updated_at: new Date(state.cloud.programAt || Date.now()).toISOString()
          }]
        }).then(function () {
          state.cloud.programSnap = programJSON();
          save();
        });
      });
  }

  function upsert(table, rows, conflict) {
    if (!rows.length) return Promise.resolve([]);
    return api("/rest/v1/" + table + "?on_conflict=" + conflict, {
      method: "POST",
      prefer: "resolution=merge-duplicates,return=representation",
      body: rows
    });
  }

  function syncNow(quiet) {
    if (!auth || sync.busy) return Promise.resolve();
    sync.busy = true;
    sync.error = null;
    if (!quiet) repaintIfData();

    var sessions = syncableSessions();
    return withSession()
      .then(syncProgram)
      .then(function () { return upsert("sessions", sessions.map(sessionRow), "user_id,client_key"); })
      .then(function (saved) {
        var idFor = {};
        (saved || []).forEach(function (row) { idFor[row.client_key] = row.id; });
        var details = sessions.filter(function (s) { return idFor[s.key]; }).map(function (s) {
          return { session_id: idFor[s.key], user_id: auth.user_id, entries: detailEntries(s) };
        });
        return upsert("session_details", details, "session_id");
      })
      .then(function () { return upsert("fuel_days", fuelRows(), "user_id,date"); })
      .then(function () { return upsert("prs", recordRows(), "user_id,exercise,achieved_on,weight,reps"); })
      .then(pushEvents)
      .then(fanoutPush)
      .then(function () {
        state.cloud.lastSyncAt = Date.now();
        save();
      })
      .catch(function (err) { sync.error = err.message; })
      .then(function () { sync.busy = false; repaintIfData(); });
  }

  /* Pull everything back — the point of the cloud copy is a phone you lost. */
  /* Wait for an in-flight sync rather than quietly doing nothing. Pressing
     Restore while the automatic sync happens to be running is common, and
     silence looks identical to a broken button. */
  function restoreFromCloud(waited) {
    if (!auth) return Promise.resolve();
    if (sync.busy) {
      /* generous: the sync it is waiting on may be uploading a whole history */
      if ((waited || 0) > 90) { sync.error = "Still syncing — try again in a moment."; render(); return Promise.resolve(); }
      return new Promise(function (go) { setTimeout(go, 400); })
        .then(function () { return restoreFromCloud((waited || 0) + 1); });
    }
    sync.busy = true;
    sync.error = null;
    repaintIfData();

    return withSession()
      .then(function () {
        return Promise.all([
          api("/rest/v1/sessions?user_id=eq." + auth.user_id + "&select=*"),
          api("/rest/v1/session_details?user_id=eq." + auth.user_id + "&select=*"),
          api("/rest/v1/fuel_days?user_id=eq." + auth.user_id + "&select=*"),
          api("/rest/v1/programs?user_id=eq." + auth.user_id + "&select=days,updated_at")
        ]);
      })
      .then(function (res) {
        var remote = res[0] || [], details = res[1] || [], fuel = res[2] || [];
        var prog = (res[3] || [])[0];
        if (prog && Array.isArray(prog.days) && prog.days.length) {
          state.program = normalize(prog.days);
          if (!getDay(state.day)) state.day = state.program[0] && state.program[0].id;
          state.cloud.programAt = Date.parse(prog.updated_at) || Date.now();
          state.cloud.programSnap = JSON.stringify(state.program);
        }
        var entriesFor = {};
        details.forEach(function (d) { entriesFor[d.session_id] = d.entries || {}; });

        var added = 0;
        remote.forEach(function (r) {
          if (state.sessions[r.client_key]) return;      /* local wins, never overwrite */
          state.sessions[r.client_key] = {
            key: r.client_key, date: r.date, dayId: r.day_id || "", dayName: r.day_name,
            color: r.color || "blue",
            startedAt: r.started_at ? Date.parse(r.started_at) : 0,
            firstSetAt: r.first_set_at ? Date.parse(r.first_set_at) : 0,
            finishedAt: r.finished_at ? Date.parse(r.finished_at) : 0,
            finished: true, entries: entriesFor[r.id] || {}
          };
          added++;
        });

        fuel.forEach(function (f) {
          if (state.fuel.days[f.date]) return;
          state.fuel.days[f.date] = {
            protein: Number(f.protein) ? [{ v: Number(f.protein), t: 0 }] : [],
            creatine: Number(f.creatine) ? [{ v: Number(f.creatine), t: 0 }] : [],
            water: Number(f.water) ? [{ v: Number(f.water), t: 0 }] : []
          };
        });

        normalizeSessions(state.sessions);
        state.cloud.lastSyncAt = Date.now();
        save();
        sync.restored = added;
      })
      .catch(function (err) { sync.error = err.message; })
      .then(function () { sync.busy = false; render(); });
  }

  /* ---- activity ----
     Events are re-derived from the local log on every sync rather than fired
     at the moment they happen, because the moment they happen you are usually
     in a basement with no signal. dedup_key makes that idempotent, and only
     the last two weeks are emitted so the payload stays bounded. */
  var EVENT_WINDOW_DAYS = 14;

  function withinWindow(date) {
    var cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - EVENT_WINDOW_DAYS);
    return date >= cutoff.toISOString().slice(0, 10);
  }

  /* Sessions restored from the cloud, or logged before timestamps existed, have
     no clock reading. Fall back to their date rather than to now, or syncing an
     old log would post the whole thing as if it happened this afternoon. */
  function eventTime(s) {
    return s.finishedAt || s.startedAt || Date.parse(s.date + "T18:00:00") || Date.now();
  }

  function eventRows() {
    var out = [], seen = {};
    function add(type, key, payload, at) {
      if (seen[key]) return;
      seen[key] = true;
      out.push({
        user_id: auth.user_id, type: type, dedup_key: key,
        payload: payload, created_at: new Date(at || Date.now()).toISOString()
      });
    }

    for (var k in state.sessions) {
      var s = state.sessions[k];
      /* Only finished workouts are worth announcing. "Started" fired on every
         sync of an in-progress session, which mostly meant the feed shouted
         each time the app was opened. */
      if (!withinWindow(s.date) || !s.finished || doneCount(s) === 0) continue;
      var when = eventTime(s);
      var lifts = 0;
      for (var exId in s.entries) {
        if (s.entries[exId].sets.some(function (x) { return x.done; })) lifts++;
      }
      add("workout_finished", "finish:" + s.key,
          { day: s.dayName, sets: doneCount(s), volume: Math.round(volumeOf(s)), unit: state.unit,
            lifts: lifts, minutes: sessionMinutes(s), prs: recordsIn(s).length }, when);
      recordsIn(s).forEach(function (r) {
        add("pr", ["pr", r.name, s.date, r.w, r.r].join(":"),
            { exercise: r.name, weight: r.w, reps: r.r, per_hand: !!r.each,
              e1rm: Math.round(r.e1rm * 10) / 10, unit: state.unit }, when);
      });
    }

    for (var date in state.fuel.days) {
      if (!withinWindow(date)) continue;
      METRICS.forEach(function (m) {
        if (!fuelHit(date, m.id)) return;
        add("goal_hit", ["goal", m.id, date].join(":"),
            { metric: m.id, name: m.name, total: fuelNum(m, fuelTotal(date, m.id)),
              target: fuelNum(m, state.fuel.targets[m.id]), unit: m.unit },
            fuelHitAt(date, m.id) || Date.parse(date + "T12:00:00"));
      });
    }
    return out;
  }

  /* Events are immutable — a repeat is dropped, never rewritten. */
  function pushEvents() {
    var rows = eventRows();
    if (!rows.length) return Promise.resolve();
    return api("/rest/v1/events?on_conflict=user_id,dedup_key", {
      method: "POST", prefer: "resolution=ignore-duplicates,return=minimal", body: rows
    });
  }

  /* ---- friends ---- */
  function otherSide(link) { return link.requester === auth.user_id ? link.addressee : link.requester; }
  function iAmRequester(link) { return link.requester === auth.user_id; }
  function iShareWith(link) { return iAmRequester(link) ? link.requester_shares_detail : link.addressee_shares_detail; }
  function theyShareWithMe(link) { return iAmRequester(link) ? link.addressee_shares_detail : link.requester_shares_detail; }

  function loadSocial() {
    if (!auth) return Promise.resolve();
    social.busy = true;
    social.error = null;
    if (ui.view === "friends") render();

    return withSession()
      .then(function () {

          api("/rest/v1/profiles?select=id,handle,display_name"),

        ]);

      .then(function (res) {
        state.social.links = res[0] || [];
        state.social.feed = res[1] || [];
        var people = {};

        state.social.people = people;
        var days = res[3] || [];
        state.social.shares = days.filter(function (d) { return d.recipient_id === auth.user_id; });
        state.social.sentShares = days.filter(function (d) { return d.owner_id === auth.user_id; });
        state.social.fetchedAt = Date.now();
        save();
      })
      .catch(function (err) { social.error = err.message; })
      .then(function () { social.busy = false; if (ui.view === "friends") render(); });
