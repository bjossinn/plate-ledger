<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Log your lifts, fuel and records, and share the day with the people you train with.">
<meta name="theme-color" content="#EDEEF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1114" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plate Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  /* an author display rule beats the UA stylesheet's [hidden], so anything
     with display:flex would ignore the attribute entirely */
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body { margin: 0; min-height: 100%; }
  button, input, textarea, select { font-family: inherit; }
  /* keep the sticky header clear of a translucent status bar when installed */
  .top { padding-top: env(safe-area-inset-top, 0px); }
</style>
<title>Plate Ledger</title>
<style>
  :root {
    --bg: #EDEEF0;
    --surface: #FFFFFF;
    --surface-2: #F5F6F8;
    --ink: #14171C;
    --muted: #5D646E;
    --faint: #8B929C;
    --line: #D8DBE0;
    --line-strong: #C2C7CF;
    --field: #FFFFFF;
    --shadow: 0 1px 2px rgba(16,20,26,.06), 0 6px 18px rgba(16,20,26,.05);

    --met-protein: #D55E00;
    --met-creatine: #009E73;
    --met-water: #0072B2;

    --plate-blue: #2F6FE0;
    --plate-red: #C8332B;
    --plate-yellow: #B8850F;
    --plate-green: #1E8F52;

    --tint: 12%;
    --scrim: rgba(16,20,26,.42);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1114;
      --surface: #171B20;
      --surface-2: #1E232A;
      --ink: #E9EBEE;
      --muted: #9AA1AB;
      --faint: #737A85;
      --line: #272D35;
      --line-strong: #363E48;
      --field: #11151A;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.32);

      --met-protein: #D66E20;
      --met-creatine: #0FA57E;
      --met-water: #3B8FCF;

      --plate-blue: #5B93FF;
      --plate-red: #F0655B;
      --plate-yellow: #E0A93A;
      --plate-green: #3FBE7C;

      --tint: 18%;
      --scrim: rgba(0,0,0,.6);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0E1114;
    --surface: #171B20;
    --surface-2: #1E232A;
    --ink: #E9EBEE;
    --muted: #9AA1AB;
    --faint: #737A85;
    --line: #272D35;
    --line-strong: #363E48;
    --field: #11151A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.32);

    --met-protein: #D66E20;
    --met-creatine: #0FA57E;
    --met-water: #3B8FCF;

    --plate-blue: #5B93FF;
    --plate-red: #F0655B;
    --plate-yellow: #E0A93A;
    --plate-green: #3FBE7C;

    --tint: 18%;
    --scrim: rgba(0,0,0,.6);
  }

  .theme-blue   { --day: var(--plate-blue); }
  .theme-red    { --day: var(--plate-red); }
  .theme-yellow { --day: var(--plate-yellow); }
  .theme-green  { --day: var(--plate-green); }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    /* kills iOS double-tap-to-zoom, which fires when you tap +5g twice in a
       row. Pinch zoom is untouched, so the page can still be enlarged. */
    touch-action: manipulation;
  }

  .num { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

  .app {
    --day: var(--plate-blue);
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 118px;
  }
  /* no fixed bar on this view, so no room reserved for one */
  .app.no-bottom { padding-bottom: 28px; }

  /* ---- top bar ---- */
  .top {
    position: sticky;
    top: 0;
    z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.6) blur(14px);
    -webkit-backdrop-filter: saturate(1.6) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px 10px;
  }
  .brand { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .brand b {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -.02em;
  }
  .brand span {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--faint);
  }

  /* five tabs need the full width on a phone, so the nav gets its own row */
  .nav {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 2px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 2px;
    margin: 0 16px 12px;
  }
  .nav button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0;
    padding: 8px 2px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .nav button[aria-current="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  .days {
    display: flex;
    gap: 8px;
    padding: 0 16px 12px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .days::-webkit-scrollbar { display: none; }
  .chip {
    appearance: none;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px 8px 10px;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
  }
  .chip i {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--c);
    display: block;
  }
  .chip[aria-pressed="true"] {
    color: var(--ink);
    border-color: color-mix(in srgb, var(--c) 55%, var(--line));
    background: color-mix(in srgb, var(--c) var(--tint), var(--surface));
  }

  /* ---- content ---- */
  main { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

  .sheet-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  h1 {
    margin: 0;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -.03em;
    text-wrap: balance;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h1::before {
    content: "";
    width: 5px;
    height: 26px;
    border-radius: 3px;
    background: var(--day);
    flex: 0 0 auto;
  }
  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }

  .btn {
    appearance: none;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 9px 13px;
    border-radius: 10px;
    cursor: pointer;
  }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { border-style: dashed; color: var(--muted); background: transparent; width: 100%; padding: 13px; }
  .btn.day { border-color: transparent; background: var(--day); color: #fff; }
  .btn.danger { color: var(--plate-red); border-color: color-mix(in srgb, var(--plate-red) 40%, var(--line)); }
  .btn.sm { font-size: 12px; padding: 7px 10px; border-radius: 9px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-head { padding: 13px 14px 11px; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
  .ex-name { font-size: 16px; font-weight: 700; letter-spacing: -.015em; margin: 0 0 3px; }
  .target {
    font-size: 12px;
    font-weight: 700;
    color: var(--day);
    letter-spacing: .01em;
  }
  .rest-tag { color: var(--faint); font-weight: 600; margin-left: 9px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .last { font-size: 12px; color: var(--faint); margin-top: 5px; }
  .last b { color: var(--muted); font-weight: 700; }

  .rows { padding: 0 14px 12px; display: flex; flex-direction: column; gap: 7px; }
  .colhead {
    display: grid;
    grid-template-columns: 30px 1fr 1fr 50px;
    gap: 8px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
    padding: 0 2px 1px;
  }
  .colhead span:nth-child(2), .colhead span:nth-child(3) { padding-left: 12px; }
  .colhead span:last-child { text-align: center; }

  .row {
    display: grid;
    grid-template-columns: 30px 1fr 1fr 50px;
    gap: 8px;
    align-items: center;
  }
  .row .idx {
    font-size: 14px;
    font-weight: 700;
    color: var(--faint);
    text-align: center;
  }
  .row.done .idx { color: var(--day); }

  input {
    width: 100%;
    height: 46px;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--ink);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 17px;
    font-weight: 600;
    text-align: center;
    padding: 0 6px;
  }
  input::placeholder { color: var(--faint); font-weight: 500; }
  input:focus-visible, .btn:focus-visible, .chip:focus-visible, .nav button:focus-visible, .tick:focus-visible {
    outline: 2px solid var(--day);
    outline-offset: 2px;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  .tick {
    appearance: none;
    height: 46px;
    width: 100%;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--faint);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .tick svg { width: 20px; height: 20px; }
  .row.done .tick { background: var(--day); border-color: var(--day); color: #fff; }
  .row.done input { background: color-mix(in srgb, var(--day) var(--tint), var(--field)); border-color: color-mix(in srgb, var(--day) 35%, var(--line)); }

  /* a record is called out in words, not by colour alone */
  .pr-flag {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--day);
    padding: 1px 0 3px 38px;
  }
  .pr-flag svg { width: 13px; height: 13px; flex: 0 0 auto; }
  .row.pr .idx { color: var(--day); }
  .row.pr input { border-color: color-mix(in srgb, var(--day) 55%, var(--line)); }

  .row-tools { display: flex; gap: 8px; padding-top: 3px; }
  .row-tools .btn { flex: 1; }

  /* ---- edit mode ---- */
  .edit-card { padding: 13px 14px; display: flex; flex-direction: column; gap: 9px; }
  .edit-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .edit-pair { display: grid; grid-template-columns: 88px 1fr; gap: 8px; }
  .f {
    width: 100%;
    height: 44px;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--ink);
    font: inherit;
    font-size: 16px;
    padding: 0 12px;
  }
  .f.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; text-align: center; font-weight: 600; }
  .f.strong { font-weight: 700; }
  textarea.f { height: auto; min-height: 120px; padding: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.5; resize: vertical; }
  .lab {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .edit-tools { display: flex; gap: 6px; }
  .edit-tools .btn { flex: 1; }

  /* ---- history ---- */
  .hist {
    width: 100%;
    border: 0;
    background: var(--surface);
    text-align: left;
    font: inherit;
    padding: 13px 14px;
    cursor: pointer;
    display: grid;
    grid-template-columns: 4px 1fr auto;
    gap: 12px;
    align-items: center;
  }
  .hist .bar { align-self: stretch; border-radius: 2px; background: var(--c); }
  .hist-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .hist-main > b { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .hist-sub { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .chip-live {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--c);
    border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line));
    border-radius: 999px;
    padding: 1px 7px;
  }
  .hist-vol { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
  .hist-vol b {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .hist-vol span { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 700; }

  .hist-body { border-top: 1px solid var(--line); padding: 12px 14px 13px; display: flex; flex-direction: column; gap: 11px; }
  .hist-ex { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: start; }
  .hist-name { font-size: 13px; font-weight: 600; align-self: center; }
  .hist-name em { font-style: normal; color: var(--faint); font-weight: 600; font-size: 11px; margin-left: 6px; }
  .hist-pr { color: var(--c); margin-right: 5px; }
  .hist-pr svg { width: 12px; height: 12px; vertical-align: -1px; }
  .hist-sets { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
  .hist-sets i {
    font-style: normal;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 3px 0;
    min-width: 68px;
    text-align: center;
  }

  /* ---- fuel ----
     Each metric is a stat tile with a meter, not a chart: one value against one
     target. Identity never rests on colour — every tile is named and labelled.
     Hues are Okabe-Ito derived, validated per mode with the palette validator. */
  .m-protein  { --m: var(--met-protein); }
  .m-creatine { --m: var(--met-creatine); }
  .m-water    { --m: var(--met-water); }

  .fuel-card { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .fuel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .fuel-name { font-size: 15px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
  .fuel-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--m); flex: 0 0 auto; }
  .fuel-val {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    font-weight: 600;
    color: var(--faint);
    white-space: nowrap;
  }
  .fuel-val b { font-size: 21px; font-weight: 700; letter-spacing: -.03em; color: var(--ink); }

  .meter { height: 10px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--m); border-radius: 0 4px 4px 0; transition: width .3s ease; }

  .fuel-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 17px; }
  .fuel-hit { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--m); display: flex; align-items: center; gap: 5px; }
  .fuel-hit svg { width: 13px; height: 13px; }
  .fuel-left { font-size: 12px; color: var(--muted); }
  .fuel-undo { font-size: 12px; font-weight: 700; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }

  .quick { display: flex; gap: 6px; }
  .quick .btn { flex: 1; }
  .custom { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
  .custom input { height: 42px; font-size: 16px; }

  .week { display: grid; grid-template-columns: 68px repeat(7, 1fr); gap: 7px 4px; align-items: center; }
  .week-h { font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); text-align: center; }
  .week-l { font-size: 12px; font-weight: 600; color: var(--muted); }
  .week i {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 1.5px solid color-mix(in srgb, var(--m) 55%, var(--line));
    background: transparent;
    margin: 0 auto;
    display: block;
  }
  .week i.on { background: var(--m); border-color: var(--m); }

  /* ---- friends & feed ---- */
  .feed-item { display: grid; grid-template-columns: 30px 1fr auto; gap: 11px; align-items: start; padding: 12px 14px; }
  .feed-item + .feed-item { border-top: 1px solid var(--line); }
  .feed-ico {
    width: 30px; height: 30px;
    border-radius: 9px;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--e) var(--tint), var(--surface-2));
    color: var(--e);
  }
  .feed-ico { font-size: 15px; line-height: 1; }
  .feed-ico svg { width: 15px; height: 15px; }
  .feed-headline {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -.015em;
    margin-top: 2px;
  }
  .feed-body { min-width: 0; }
  .feed-line { font-size: 13.5px; line-height: 1.4; }
  .feed-line b { font-weight: 700; }
  .feed-sub { font-size: 12px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .feed-when { font-size: 11px; color: var(--faint); font-weight: 600; white-space: nowrap; padding-top: 2px; }

  .who { display: grid; grid-template-columns: 34px 1fr auto; gap: 11px; align-items: center; padding: 12px 14px; }
  .who + .who { border-top: 1px solid var(--line); }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface-2);
    border: 1px solid var(--line);
    font-size: 13px; font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;
  }
  .who-main { min-width: 0; }
  .who-main b { display: block; font-size: 14.5px; font-weight: 700; letter-spacing: -.01em; }
  .who-main span { font-size: 12px; color: var(--muted); }
  .who-acts { display: flex; gap: 6px; align-items: center; }

  .share-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 11px 14px 13px;
    border-top: 1px solid var(--line);
    background: var(--surface-2);
  }
  .share-row span { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .switch {
    appearance: none;
    flex: 0 0 auto;
    width: 46px; height: 27px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    position: relative;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 21px; height: 21px;
    border-radius: 50%;
    background: var(--faint);
    transition: transform .15s ease, background .15s ease;
  }
  .switch[aria-pressed="true"] { background: var(--day); border-color: var(--day); }
  .switch[aria-pressed="true"]::after { transform: translateX(19px); background: #fff; }

  /* ---- session complete ---- */
  .scrim {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--scrim);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 16px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    animation: fade .18s ease;

  .done-card {

<body>
<div class="app" id="app">

  </header>

  <main id="view"></main>

  <div class="bottom" id="bottom">

    </button>
